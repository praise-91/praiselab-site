<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리타기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #1A1E2E;
    --steel-mid: #252A3D;
    --steel-light: #2E3450;
    --text: #F0F2FF;
    --text-dim: #8892B0;
    --give: #3BE88A;
    --border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--steel);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  /* ── 상단 브랜드 네비 ── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(26, 30, 46, 0.8);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand { font-size: 15px; font-weight: 700; color: var(--text); text-decoration: none; }

  .hamburger-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 사이드 메뉴 ── */
  .menu-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5);
    justify-content: flex-end;
  }
  .menu-overlay.show { display: flex; }
  .menu-sheet {
    width: 78%; max-width: 300px; height: 100%;
    background: var(--steel-mid);
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column;
    animation: menuSlideIn 0.22s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes menuSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 2px; }
  .menu-title { font-size: 15px; font-weight: 900; color: var(--text-dim); letter-spacing: 0.5px; }
  .menu-close { width: 32px; height: 32px; border-radius: 8px; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
  .menu-close:hover { color: var(--orange); }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-radius: 12px;
    background: none; border: none;
    color: var(--text); font-family: inherit;
    font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; width: 100%;
  }
  .menu-item:hover { background: var(--steel-light); }
  .menu-item-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-item--logout { margin-top: auto; color: #ff8a8a; }

  .locked-link {
    display: block;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    color: var(--orange);
    text-align: center;
    text-decoration: none;
    font-weight: 900;
  }
  .locked-link:hover { background: rgba(255,107,43,0.08); }

  header.page-head { text-align: center; padding: 28px 0 24px; }
  .header-icon { font-size: 40px; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(255,107,43,0.5)); }
  header.page-head h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .sync-indicator { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--give); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
  .loading-brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

  .card {
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .section-label { font-size: 12px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.8px; margin-bottom: 12px; }

  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: 14px; line-height: 1.7; }
  .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.6; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--orange);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: inherit;
    font-size: 16px; font-weight: 900;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--orange-dark); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .white-btn {
    width: 100%;
    padding: 14px;
    background: #fff;
    border: none;
    border-radius: 12px;
    color: var(--orange);
    font-family: inherit;
    font-size: 15px; font-weight: 900;
    cursor: pointer;
  }
  .white-btn:hover { background: rgba(255,255,255,0.9); }

  .cancel-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  .cancel-link:hover { color: var(--text); }

  /* ── 벌칙 프리셋 칩 ── */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.4px; margin-bottom: 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset-chip {
    padding: 9px 14px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
  }
  .preset-chip:hover { border-color: var(--orange); }

  .custom-add-row { display: flex; gap: 8px; margin-top: 10px; }
  .custom-add-row input {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .custom-add-row input:focus { border-color: var(--orange); }
  .custom-add-btn {
    padding: 0 18px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .custom-add-btn:hover { border-color: var(--orange); color: var(--orange); }

  .draft-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .draft-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 14px;
    background: rgba(255,107,43,0.12);
    border: 1px solid rgba(255,107,43,0.3);
    border-radius: 20px;
    font-size: 13px; font-weight: 700;
    color: var(--text);
  }
  .draft-chip button {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }
  .draft-chip button:hover { background: rgba(255,68,68,0.4); }

  /* ── 대기실 참가자 목록 ── */
  .capacity-badge {
    display: inline-block;
    font-size: 12px; font-weight: 900;
    color: var(--orange);
    background: rgba(255,107,43,0.12);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .participant-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .participant-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--steel-light);
    border-radius: 10px;
    font-size: 14px; font-weight: 700;
  }
  .participant-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .participant-row .me-tag { margin-left: auto; font-size: 11px; color: var(--give); font-weight: 900; }
  .participant-empty-row {
    padding: 10px 14px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    font-size: 13px; color: var(--text-dim);
    text-align: center;
  }

  /* ── 사다리 SVG ── */
  .ladder-wrap { overflow-x: auto; margin-bottom: 16px; }
  .ladder-svg { display: block; margin: 0 auto; }
  .ladder-line { stroke: var(--border); stroke-width: 2; }
  .ladder-rung { stroke: var(--border); stroke-width: 2; }
  .ladder-marker { transition: cx 0.14s linear, cy 0.14s linear; }

  .legend-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .legend-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .legend-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ── 결과 ── */
  .result-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .result-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: var(--steel-light);
    border-radius: 10px;
    font-size: 14px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .result-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .result-row .name { font-weight: 700; }
  .result-row .arrow { color: var(--text-dim); margin: 0 4px; }
  .result-row .item { font-weight: 900; color: var(--orange); margin-left: auto; }
</style>
</head>
<body>

<header class="site-header">
  <a href="https://praiselab.net/tools/" class="brand">Feeder</a>
  <button class="hamburger-btn" id="hamburger-btn" onclick="openMenu()" style="display:none;" aria-label="메뉴">☰</button>
</header>

<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()">
  <div class="menu-sheet" onclick="event.stopPropagation()">
    <div class="menu-head">
      <span class="menu-title">메뉴</span>
      <button class="menu-close" onclick="closeMenu()" aria-label="닫기">✕</button>
    </div>
    <button class="menu-item" onclick="closeMenu(); location.href='index.html';">
      <span class="menu-item-icon">🏠</span><span>피더 홈</span>
    </button>
    <button class="menu-item menu-item--logout" onclick="closeMenu(); logout();">
      <span class="menu-item-icon">🚪</span><span>로그아웃</span>
    </button>
  </div>
</div>

<div class="container">

  <!-- 로그인 상태 확인 중 -->
  <div class="view active" id="view-checking">
    <div class="loading-brand">
      <div class="loading-brand-title">Feeder</div>
      <div class="loading-brand-sub">불러오는 중…</div>
    </div>
  </div>

  <!-- 로그인 필요 -->
  <div class="view" id="view-locked">
    <header class="page-head">
      <span class="header-icon">🔒</span>
      <h1>로그인이 필요해요</h1>
      <div class="page-sub">피더 홈에서 로그인 후 다시 들어와주세요</div>
    </header>
    <div class="card">
      <a href="index.html" class="locked-link">피더 홈으로 →</a>
    </div>
  </div>

  <!-- 팀 없음 (teamCode 없는 옛날 계정) -->
  <div class="view" id="view-no-team">
    <header class="page-head">
      <span class="header-icon">🪜</span>
      <h1>사다리타기</h1>
      <div class="page-sub">팀 코드가 있어야 팀원들과 같이 즐길 수 있어요</div>
    </header>
    <div class="card">
      <a href="index.html" class="locked-link">피더 홈으로 →</a>
    </div>
  </div>

  <!-- 사다리타기 앱 -->
  <div class="view" id="view-app">
    <header class="page-head">
      <span class="header-icon">🪜</span>
      <h1>사다리타기</h1>
      <div class="sync-indicator"><span class="sync-dot"></span>실시간 공유 중</div>
    </header>

    <!-- 활성 방 없을 때 -->
    <div id="no-room-block">
      <div class="card">
        <div class="empty-state"><span class="empty-icon">🪜</span>진행중인 사다리가 없어요</div>
      </div>
      <button class="submit-btn" onclick="openCreateForm()">+ 새 사다리 만들기</button>
    </div>

    <!-- 방 만들기 폼 -->
    <div class="card" id="create-form" style="display:none;">
      <div class="field">
        <label>벌칙/결과 항목 고르기</label>
        <div class="chip-row" id="preset-chip-row"></div>
        <div class="custom-add-row">
          <input type="text" id="custom-item-input" placeholder="직접 입력 (예: 오늘 밥값 내기)" />
          <button class="custom-add-btn" onclick="addCustomItem()">추가</button>
        </div>
      </div>
      <div class="field" id="draft-list-field" style="display:none;">
        <label>추가된 항목 (= 정원)</label>
        <div class="draft-list" id="draft-list"></div>
      </div>
      <button class="submit-btn" id="create-submit-btn" onclick="createRoom()">사다리 만들기 →</button>
      <button class="cancel-link" onclick="closeCreateForm()">취소</button>
    </div>

    <!-- 활성 방 -->
    <div id="room-block" style="display:none;"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAIPHUtjoIEjVDmgMgXD3-Moq5oz--2_xY",
    authDomain: "healingcamp-51eb0.firebaseapp.com",
    projectId: "healingcamp-51eb0",
  });

  const auth = firebase.auth();
  const db = firebase.firestore();
  const colToolsUsers = db.collection('tools_users');
  const colTeamLadders = db.collection('team_ladders');

  const PRESET_ITEMS = ['☕ 커피사기', '🧹 청소당번', '🙋 막내가쏜다', '🚬 담배사기', '🍿 간식사기', '💨 꽝'];
  const MARKER_COLORS = ['#FF6B2B','#3BE88A','#4FC3F7','#FFD54F','#BA68C8','#FF8A80','#81C784','#F06292','#90A4AE','#FFB74D'];

  let myUid = null, myName = '', myTeamCode = null;
  let gateProfileUnsub = null;
  let roomUnsub = null;
  let currentRoom = null;
  let draftItems = [];
  let creatingFormOpen = false;
  let renderedPlayingRoomId = null;

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function go(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function openMenu() { document.getElementById('menu-overlay').classList.add('show'); }
  function closeMenu() { document.getElementById('menu-overlay').classList.remove('show'); }
  function logout() { auth.signOut().then(() => { location.href = 'index.html'; }); }

  // ══════════════ 방 만들기 폼 ══════════════

  function renderPresetChips() {
    const row = document.getElementById('preset-chip-row');
    row.innerHTML = PRESET_ITEMS.map(item =>
      `<button class="preset-chip" onclick="addDraftItem('${item.replace(/'/g,"\\'")}')">${escapeHtml(item)}</button>`
    ).join('');
  }

  function addDraftItem(item) {
    draftItems.push(item);
    renderDraftList();
  }

  function addCustomItem() {
    const input = document.getElementById('custom-item-input');
    const val = input.value.trim();
    if (!val) return;
    draftItems.push(val);
    input.value = '';
    renderDraftList();
  }

  function removeDraftItem(idx) {
    draftItems.splice(idx, 1);
    renderDraftList();
  }

  function renderDraftList() {
    const field = document.getElementById('draft-list-field');
    const list = document.getElementById('draft-list');
    if (!draftItems.length) {
      field.style.display = 'none';
      list.innerHTML = '';
    } else {
      field.style.display = 'block';
      list.innerHTML = draftItems.map((item, i) =>
        `<span class="draft-chip">${escapeHtml(item)}<button onclick="removeDraftItem(${i})">✕</button></span>`
      ).join('');
    }
    document.getElementById('create-submit-btn').disabled = draftItems.length < 2;
  }

  function openCreateForm() {
    if (currentRoom) return;
    draftItems = [];
    renderPresetChips();
    renderDraftList();
    creatingFormOpen = true;
    renderApp();
  }

  function closeCreateForm() {
    creatingFormOpen = false;
    renderApp();
  }

  function createRoom() {
    if (draftItems.length < 2) { alert('벌칙 항목을 2개 이상 추가해주세요!'); return; }
    const btn = document.getElementById('create-submit-btn');
    btn.disabled = true;
    colTeamLadders.add({
      teamCode: myTeamCode,
      status: 'waiting',
      items: draftItems.slice(),
      participants: [{ uid: myUid, name: myName }],
      createdBy: myUid,
      createdByName: myName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(() => {
      creatingFormOpen = false;
    }).catch(err => {
      console.error('createRoom failed:', err);
      alert('만들기 실패 (' + (err.code || err.message) + ')');
      btn.disabled = false;
    });
  }

  // ══════════════ 대기실: 참가 / 시작 / 닫기 ══════════════

  function joinRoom() {
    if (!currentRoom) return;
    const ref = colTeamLadders.doc(currentRoom.id);
    db.runTransaction(tx => tx.get(ref).then(doc => {
      if (!doc.exists) return;
      const data = doc.data();
      if (data.status !== 'waiting') return;
      const participants = data.participants || [];
      if (participants.some(p => p.uid === myUid)) return;
      if (participants.length >= data.items.length) { throw new Error('full'); }
      participants.push({ uid: myUid, name: myName });
      tx.update(ref, { participants });
    })).catch(err => {
      if (err && err.message === 'full') alert('정원이 다 찼어요!');
    });
  }

  function startRoom() {
    if (!currentRoom) return;
    const ref = colTeamLadders.doc(currentRoom.id);
    db.runTransaction(tx => tx.get(ref).then(doc => {
      if (!doc.exists) return;
      const data = doc.data();
      if (data.status !== 'waiting') return;
      const n = (data.participants || []).length;
      if (n < 2 || n !== data.items.length) { throw new Error('not-full'); }
      const rungs = generateRungs(n);
      tx.update(ref, { status: 'playing', rungs, startedAt: firebase.firestore.FieldValue.serverTimestamp() });
    })).catch(err => {
      if (err && err.message === 'not-full') alert('정원이 다 차야 시작할 수 있어요!');
    });
  }

  function closeRoom() {
    if (!currentRoom) return;
    if (!confirm('이 사다리를 닫을까요?')) return;
    colTeamLadders.doc(currentRoom.id).delete().catch(() => alert('처리 실패. 다시 시도해주세요.'));
  }

  // ══════════════ 사다리 생성 · 경로 계산 ══════════════

  function generateRungs(n) {
    const rows = 10 + Math.floor(Math.random() * 4);
    const rungs = [];
    for (let r = 0; r < rows; r++) {
      const row = new Array(n - 1).fill(false);
      let gap = 0;
      while (gap < n - 1) {
        if (Math.random() < 0.35) { row[gap] = true; gap += 2; }
        else { gap += 1; }
      }
      rungs.push(row);
    }
    return rungs;
  }

  function traceColumn(startCol, rungs, n) {
    let col = startCol;
    const rowH = 28, topPad = 24;
    const pts = [{ x: startCol, y: 0 }];
    for (let r = 0; r < rungs.length; r++) {
      const row = rungs[r];
      if (col < n - 1 && row[col]) { pts.push({ x: col, y: r + 1 }); col += 1; pts.push({ x: col, y: r + 1 }); }
      else if (col > 0 && row[col - 1]) { pts.push({ x: col, y: r + 1 }); col -= 1; pts.push({ x: col, y: r + 1 }); }
      else { pts.push({ x: col, y: r + 1 }); }
    }
    pts.push({ x: col, y: rungs.length + 1 });
    return { endCol: col, gridPts: pts };
  }

  // ══════════════ 렌더링 ══════════════

  function renderApp() {
    const hasRoom = !!currentRoom;
    document.getElementById('no-room-block').style.display = (!hasRoom && !creatingFormOpen) ? 'block' : 'none';
    document.getElementById('create-form').style.display = (!hasRoom && creatingFormOpen) ? 'block' : 'none';
    document.getElementById('room-block').style.display = hasRoom ? 'block' : 'none';
    if (hasRoom) renderRoomBlock();
  }

  function renderRoomBlock() {
    const room = currentRoom;
    const block = document.getElementById('room-block');

    if (room.status === 'waiting') {
      renderedPlayingRoomId = null;
      const participants = room.participants || [];
      const full = participants.length >= room.items.length;
      const iJoined = participants.some(p => p.uid === myUid);

      const rows = participants.map((p, i) => `
        <div class="participant-row">
          <span class="dot" style="background:${MARKER_COLORS[i % MARKER_COLORS.length]}"></span>
          <span>${escapeHtml(p.name)}</span>
          ${p.uid === myUid ? '<span class="me-tag">나</span>' : ''}
        </div>`).join('');
      const emptySlots = Array.from({ length: Math.max(0, room.items.length - participants.length) })
        .map(() => `<div class="participant-empty-row">대기 중…</div>`).join('');

      block.innerHTML = `
        <div class="card">
          <span class="capacity-badge">${participants.length} / ${room.items.length}명 참가</span>
          <div class="participant-list">${rows}${emptySlots}</div>
          ${!iJoined ? `<button class="submit-btn" onclick="joinRoom()" ${full ? 'disabled' : ''}>${full ? '정원이 다 찼어요' : '참가하기'}</button>` : ''}
          ${iJoined && !full ? `<div class="empty-state" style="padding:8px 0 0;">참가 완료! 다른 팀원을 기다리는 중…</div>` : ''}
          ${full ? `<button class="submit-btn" onclick="startRoom()" style="margin-top:${iJoined ? '0' : '10px'};">시작하기 →</button>` : ''}
          <button class="cancel-link" onclick="closeRoom()">이 사다리 취소하기</button>
        </div>`;
      return;
    }

    if (room.status === 'playing') {
      if (renderedPlayingRoomId === room.id) return; // 이미 렌더링·애니메이션 중이면 건드리지 않음
      renderedPlayingRoomId = room.id;
      renderLadder(room);
      return;
    }
  }

  function renderLadder(room) {
    const block = document.getElementById('room-block');
    const participants = room.participants;
    const items = room.items;
    const rungs = room.rungs;
    const n = participants.length;

    const colW = 56, topPad = 24, rowH = 26, sidePad = 20;
    const width = sidePad * 2 + colW * (n - 1);
    const height = topPad * 2 + rowH * (rungs.length + 1) + 30;

    function px(col) { return sidePad + col * colW; }
    function py(rowIdx) { return topPad + rowIdx * rowH; }

    let linesSvg = '';
    for (let c = 0; c < n; c++) {
      linesSvg += `<line class="ladder-line" x1="${px(c)}" y1="${py(0)}" x2="${px(c)}" y2="${py(rungs.length + 1)}" />`;
    }
    for (let r = 0; r < rungs.length; r++) {
      for (let g = 0; g < n - 1; g++) {
        if (rungs[r][g]) {
          linesSvg += `<line class="ladder-rung" x1="${px(g)}" y1="${py(r + 1)}" x2="${px(g + 1)}" y2="${py(r + 1)}" />`;
        }
      }
    }

    let markersSvg = '';
    const traces = [];
    for (let c = 0; c < n; c++) {
      const { endCol, gridPts } = traceColumn(c, rungs, n);
      traces.push({ startCol: c, endCol, gridPts, color: MARKER_COLORS[c % MARKER_COLORS.length] });
      markersSvg += `<circle class="ladder-marker" id="marker-${c}" cx="${px(c)}" cy="${py(0)}" r="6" fill="${MARKER_COLORS[c % MARKER_COLORS.length]}" stroke="#1A1E2E" stroke-width="1.5" />`;
    }

    let labelsSvg = '';
    for (let c = 0; c < n; c++) {
      labelsSvg += `<text x="${px(c)}" y="${py(rungs.length + 1) + 22}" text-anchor="middle" font-size="11" fill="#8892B0">${escapeHtml(items[c] || '')}</text>`;
    }

    const legend = participants.map((p, i) =>
      `<span class="legend-chip"><span class="dot" style="background:${MARKER_COLORS[i % MARKER_COLORS.length]}"></span>${escapeHtml(p.name)}</span>`
    ).join('');

    block.innerHTML = `
      <div class="card">
        <div class="legend-list">${legend}</div>
        <div class="ladder-wrap">
          <svg class="ladder-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            ${linesSvg}
            ${labelsSvg}
            ${markersSvg}
          </svg>
        </div>
        <div id="ladder-result-area"></div>
      </div>`;

    const stepDuration = 130;
    traces.forEach(t => {
      const el = document.getElementById('marker-' + t.startCol);
      let i = 0;
      function step() {
        if (i >= t.gridPts.length) return;
        const pt = t.gridPts[i];
        el.setAttribute('cx', px(pt.x));
        el.setAttribute('cy', py(pt.y));
        i++;
        if (i < t.gridPts.length) setTimeout(step, stepDuration);
      }
      step();
    });

    const totalDuration = stepDuration * Math.max(...traces.map(t => t.gridPts.length)) + 300;
    setTimeout(() => showLadderResult(room, traces), totalDuration);
  }

  function showLadderResult(room, traces) {
    const area = document.getElementById('ladder-result-area');
    if (!area) return;
    const rows = traces.map(t => {
      const p = room.participants[t.startCol];
      const item = room.items[t.endCol];
      const color = MARKER_COLORS[t.startCol % MARKER_COLORS.length];
      return `
        <div class="result-row">
          <span class="dot" style="background:${color}"></span>
          <span class="name">${escapeHtml(p.name)}</span>
          <span class="arrow">→</span>
          <span class="item">${escapeHtml(item)}</span>
        </div>`;
    }).join('');
    area.innerHTML = `
      <div class="result-list" style="margin-top:16px;">${rows}</div>
      <button class="submit-btn" onclick="closeRoom()">닫기</button>`;
  }

  // ══════════════ 팀 사다리 실시간 구독 ══════════════

  function startRoomFeed() {
    if (roomUnsub) return;
    roomUnsub = colTeamLadders.where('teamCode', '==', myTeamCode).onSnapshot(snap => {
      const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      docs.sort((a, b) => (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0));
      currentRoom = docs[0] || null;
      if (!currentRoom) renderedPlayingRoomId = null;
      renderApp();
    }, () => {
      document.getElementById('room-block').innerHTML = '<div class="card"><div class="empty-state">⚠️ 연결 오류. 새로고침 해주세요.</div></div>';
    });
  }

  // ══════════════ 로그인 게이트 ══════════════

  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }

    if (!user) {
      myUid = null;
      document.getElementById('hamburger-btn').style.display = 'none';
      closeMenu();
      go('view-locked');
      return;
    }

    gateProfileUnsub = colToolsUsers.doc(user.uid).onSnapshot(doc => {
      if (!doc.exists || doc.data().status !== 'approved') {
        myUid = null;
        document.getElementById('hamburger-btn').style.display = 'none';
        closeMenu();
        go('view-locked');
        return;
      }
      const profile = doc.data();
      const teamCode = profile.teamCode || profile.adminTeamCode || null;
      if (!teamCode) {
        document.getElementById('hamburger-btn').style.display = 'none';
        closeMenu();
        go('view-no-team');
        return;
      }
      myUid = user.uid;
      myName = profile.name;
      myTeamCode = teamCode;

      document.getElementById('hamburger-btn').style.display = '';
      startRoomFeed();
      go('view-app');
    });
  });
</script>
</body>

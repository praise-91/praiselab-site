<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이올렛 — 지금 상태</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --steel: #1A1E2E;
    --steel-mid: #252A3D;
    --steel-light: #2E3450;
    --text: #F0F2FF;
    --text-dim: #8892B0;
    --border: rgba(255,255,255,0.08);
  }


  /* ── 🟢 지금 상태 (2026-08-20 · 폰에서 「돌고 있나」를 본다) ── */
  .live-card { background: var(--steel-mid); border: 1px solid var(--border);
               border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .live-age  { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .live-age b { color: var(--text); }
  .live-stale { color: #FFB020 !important; font-weight: 700; }
  .live-dead  { opacity: .45; }
  .live-row  { display: flex; align-items: center; gap: 10px;
               padding: 11px 0; border-top: 1px solid var(--border); }
  .live-row:first-of-type { border-top: 0; }
  .live-who  { width: 46px; font-weight: 700; font-size: 15px; }
  .live-main { flex: 1 1 auto; min-width: 0; }
  .live-big  { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .live-sub  { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .go   { color: #3BE88A; }
  .stop { color: #FF5A5A; }
  .unk  { color: #8892B0; }
  .live-last { font-size: 12.5px; color: var(--text-dim);
               border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
  .live-last b { color: var(--text); }
  .live-caveat { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--steel);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  /* ── 상단 브랜드 네비 (모든 도구 공통) ── */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(26, 30, 46, 0.8);
    border-bottom: 1px solid var(--border);
    padding: 0 20px; height: 52px;
    display: flex; align-items: center;
    margin: -20px -16px 20px;
  }
  .brand {
    font-size: 15px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .brand-icon {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, #FF6B2E, #FFB347);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  header.page-head { text-align: center; padding: 28px 0 20px; }
  .header-icon { font-size: 40px; display: block; margin-bottom: 12px; }
  header.page-head h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }

  /* 찍은 시각 — ⛔이게 없으면 낡은 스냅샷을 최신으로 읽는다 */
  .shot-at {
    margin-top: 10px; font-size: 11px; color: var(--text-dim);
  }
  .shot-at b { color: var(--text); font-weight: 700; }

  /* 탭 = 화면이동 ⇒ 흰색 배경 + 주황 글씨 (버튼 색상 원칙) */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1 1 0; min-width: 0;
    padding: 11px 4px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.10); color: var(--text-dim);
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .tab.on { background: #FFFFFF; color: var(--orange); }

  .shot {
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    overflow-x: auto;
  }
  .shot img {
    display: block; width: 100%; max-width: 450px;
    margin: 0 auto; border-radius: 8px;
  }
  /* 1:1 로 보기 — 폰 폭보다 크면 가로 스크롤로 본다 */
  .shot.zoom img { width: 450px; max-width: none; margin: 0; }

  .hint {
    margin-top: 10px; text-align: center;
    font-size: 11px; color: var(--text-dim);
  }

  .note {
    margin-top: 18px; padding: 12px 14px;
    background: var(--steel-mid); border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px; line-height: 1.7; color: var(--text-dim);
  }
  .note b { color: var(--text); }
</style>
</head>
<body>

<header class="site-header">
  <a href="https://praiselab.net/" class="brand">
    <div class="brand-icon">🏕️</div>
    Praiselab
  </a>
</header>

<div class="container">
  <header class="page-head">
    <span class="header-icon">🟣</span>
    <h1>바이올렛 — 지금 상태</h1>
  </header>


  <div class="live-card" id="live-card">
    <div class="live-age">이 화면은 <b id="live-age">—</b> 기준</div>
    <div id="live-rows"></div>
    <div class="live-last" id="live-last">—</div>
    <div class="live-caveat" id="live-caveat"></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="1">ATS+</button>
    <button class="tab" data-tab="2">명령어</button>
    <button class="tab" data-tab="3">설정</button>
  </div>

  <div class="shot" id="shot">
    <img id="shot-img" alt="바이올렛 UI 레이아웃">
  </div>
  <div class="hint">그림을 누르면 1:1 크기로 본다 (가로로 밀어서)<br>
    이 <b>레이아웃 그림</b>은 <b id="shot-at">—</b> 에 찍은 것이다 (위 상태와 다른 시각이다)</div>

  <div class="note">
    <b>읽기 전용이다.</b> 여기서 고쳐도 아무 데도 안 들어간다 —
    편집은 집 PC의 편집기(<span style="white-space:nowrap">127.0.0.1:8777</span>)에서만 한다.
    레이아웃을 고친 뒤 <b>snap_to_site.py</b> 를 돌려야 이 화면이 바뀐다.
  </div>
</div>

<script>

// ⛔이 줄은 status_to_site.py 가 통째로 갈아끼운다. 손으로 고치지 마라.
const LIVE = {"at":1787207693.4,"at_hm":"15:34:53","clients":[{"who":"1번","moving":true,"ats":true,"hp":"정상","ago":6.0,"why":null},{"who":"2번","moving":true,"ats":true,"hp":"정상","ago":9.0,"why":null}],"last":"원장 기준 마지막 조작 · <b>14:29:39 켰다</b> — 🙋 사용자","caveat":"게임 안에서 직접 켜고 끈 것(Ctrl+D 등)은 여기 안 남는다. 「마지막 조작」은 우리 도구를 거친 것만이다."};

(function () {
  var card = document.getElementById('live-card');
  var age  = document.getElementById('live-age');
  var rows = document.getElementById('live-rows');

  // ⭐낡음을 ★스스로 말한다 — 📄발행기가 죽으면 화면이 얼어붙는다. 그걸 정상으로 보이게 하면 안 된다
  function paintAge() {
    if (!LIVE.at) { age.textContent = '아직 받은 게 없다'; card.classList.add('live-dead'); return; }
    var m = Math.round((Date.now() / 1000 - LIVE.at) / 60);
    age.textContent = LIVE.at_hm + (m <= 1 ? ' (방금)' : ' (' + m + '분 전)');
    if (m >= 10) { age.parentNode.classList.add('live-stale'); }
    if (m >= 30) { card.classList.add('live-dead'); }
  }

  function paintRows() {
    if (!LIVE.clients.length) { rows.innerHTML = '<div class="live-sub">클라가 안 잡힌다</div>'; return; }
    rows.innerHTML = LIVE.clients.map(function (c) {
      var cls = c.moving === true ? 'go' : (c.moving === false ? 'stop' : 'unk');
      // 🔑⭐**★비대칭이다** — 움직이면 ★확실히 살아있지만 ⛔안 움직인다고 ★멈춘 게 ⚪아니다
      //   🅾️2026-08-20 09:1x: 제자리에서 ★때리는 중이었는데 ★「멈춰 있다」로 ★거짓 경보를 냈다
      //   ⇒ ⭐**★단정하는 말을 ★뺀다** — ★「움직임이 안 보인다」까지만 말한다
      // 🔄**★판정 지문 교체**(2026-08-20 10:5x · 🎖던전 실측) — ⭐«최근 15초에 ★공격이 있었나»
      //   ⛔좌표는 ★안 쓴다 — 🔒서성이는 중에도 ★좌표는 ★변한다(8/11) ⇒ ★멈춤을 ★못 가른다
      var txt = c.moving === true ? '사냥 중'
              : (c.moving === false ? '안 때린 지 오래' : '모른다');
      var sub = [];
      if (c.ats !== null && c.ats !== undefined) sub.push('ATS 표시 ' + (c.ats ? '켜짐' : '꺼짐'));
      if (c.hp) sub.push('HP ' + c.hp);
      if (c.why) sub.push(c.why);
      if (c.moving === false) sub.push('15초 넘게 공격이 없다 — 막혔거나 제외 대상일 수 있다');
      if (c.ago !== null && c.ago !== undefined) sub.push('마지막 공격 ' + c.ago + '초 전');
      return '<div class="live-row"><div class="live-who">' + c.who + '</div>' +
             '<div class="live-main"><div class="live-big ' + cls + '">' + txt + '</div>' +
             '<div class="live-sub">' + sub.join(' · ') + '</div></div></div>';
    }).join('');
  }

  paintAge(); paintRows();
  document.getElementById('live-last').innerHTML = LIVE.last || '';
  document.getElementById('live-caveat').textContent = LIVE.caveat || '';
})();

// ⛔이 줄은 snap_to_site.py 가 통째로 갈아끼운다. 손으로 고치지 마라.
//   🔑정적 파일은 4시간 캐시된다 ⇒ 같은 경로에 새 PNG 를 올려도 폰은 옛 그림을 본다.
//     HTML 만 max-age=0 이라, ★버전을 HTML 안에 두고 그림 주소에 붙인다.
const SNAP = {"at": "2026-08-19 21:09", "v": "20260819210922"};

document.getElementById('shot-at').textContent = SNAP.at;

const img = document.getElementById('shot-img');
const shot = document.getElementById('shot');

function show(tab) {
  img.src = 'assets/violet/tab' + tab + '.png?v=' + SNAP.v;
  document.querySelectorAll('.tab').forEach(function (b) {
    b.classList.toggle('on', b.dataset.tab === String(tab));
  });
  shot.classList.remove('zoom');
  shot.scrollLeft = 0;
}

document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { show(b.dataset.tab); });
});
shot.addEventListener('click', function () { shot.classList.toggle('zoom'); });

show(1);
</script>

</body>
</html>

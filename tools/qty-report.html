<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물량작성</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #1A1E2E;
    --steel-mid: #252A3D;
    --steel-light: #2E3450;
    --text: #F0F2FF;
    --text-dim: #8892B0;
    --give: #3BE88A;
    --border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--steel);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  /* ── 상단 브랜드 네비 ── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(26, 30, 46, 0.8);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .brand-icon {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, #FF6B2E, #FFB347);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  .whoami {
    font-size: 12px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .whoami:hover { border-color: var(--orange); color: var(--orange); }

  header.page-head { text-align: center; padding: 28px 0 24px; }
  .header-icon { font-size: 40px; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(255,107,43,0.5)); }
  header.page-head h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .sync-indicator {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 10px;
    font-size: 11px; color: var(--text-dim);
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--give);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── 화면 전환 ── */
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 뒤로가기 헤더 ── */
  .view-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .back-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--steel-mid);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .view-head h2 { font-size: 18px; font-weight: 900; }

  /* ── 카드 ── */
  .card {
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  /* ── 이름 선택 ── */
  .worker-list { display: flex; flex-direction: column; gap: 8px; }
  .worker-row { display: flex; gap: 8px; align-items: center; }
  .worker-btn {
    flex: 1;
    padding: 15px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--steel-light);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .worker-btn:hover { border-color: var(--orange); }

  .del-btn {
    width: 38px; height: 38px;
    border: 1px solid rgba(255,68,68,0.25);
    border-radius: 10px;
    background: transparent;
    color: rgba(255,68,68,0.5);
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .del-btn:hover { background: rgba(255,68,68,0.1); color: #ff4444; }

  .pw-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .pw-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── + 추가 입력줄 ── */
  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-row input {
    flex: 1;
    padding: 13px 14px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    -webkit-appearance: none;
  }
  .add-row input:focus { border-color: var(--orange); }
  .add-row input.pw-field {
    width: 80px;
    flex: none;
    font-size: 14px;
    padding: 13px 8px;
    text-align: center;
    letter-spacing: 4px;
  }
  .add-btn {
    padding: 0 18px;
    background: var(--orange);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--orange-dark); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 대분류 그리드 ── */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cat-btn {
    padding: 22px 12px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--steel-mid);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .cat-btn:hover { border-color: var(--orange); transform: translateY(-1px); }
  .cat-btn .cat-emoji { font-size: 24px; }
  .cat-btn .cat-unit { font-size: 11px; color: var(--text-dim); }

  /* ── 자재 리스트 ── */
  .search-input {
    width: 100%;
    padding: 13px 14px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
    -webkit-appearance: none;
  }
  .search-input:focus { border-color: var(--orange); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: flex; gap: 8px; align-items: center; }
  .item-btn {
    flex: 1;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--steel-light);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s;
  }
  .item-btn:hover { border-color: var(--orange); }
  .item-unit {
    font-size: 11px;
    font-weight: 700;
    color: var(--orange);
    background: rgba(255,107,43,0.12);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .empty-state {
    text-align: center;
    padding: 36px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty-state .empty-icon { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.4; }

  /* ── 수량 입력 폼 ── */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    outline: none;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: var(--orange); }

  /* 비밀번호 입력 (수량 입력 스타일 override) */
  #pw-input {
    font-size: 28px;
    text-align: center;
    letter-spacing: 8px;
  }

  .field-select {
    width: 100%;
    padding: 13px 14px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    outline: none;
    -webkit-appearance: none;
  }
  .field-select:focus { border-color: var(--orange); }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--orange);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: inherit;
    font-size: 16px; font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
  }
  .submit-btn:hover { background: var(--orange-dark); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 오늘 입력 내역 ── */
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-name { font-size: 14px; font-weight: 700; }
  .entry-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .entry-qty {
    font-size: 15px; font-weight: 900;
    color: var(--orange);
    white-space: nowrap;
  }

  /* ── 합산 보기 링크 ── */
  .summary-link-btn {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    background: var(--steel-mid);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .summary-link-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 합산 화면 ── */
  .date-range-row { display: flex; gap: 10px; }
  .date-range-row .field { flex: 1 1 0; min-width: 0; }
  .date-range-row .field input {
    width: 100%;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 8px;
  }
  .summary-list { display: flex; flex-direction: column; gap: 6px; }
  .summary-group-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--orange);
    margin: 16px 0 8px;
  }
  .summary-group-title:first-child { margin-top: 0; }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
  }
  .summary-item-name { font-weight: 500; }
  .summary-qty { font-weight: 900; color: var(--give); white-space: nowrap; }

  /* ── 전체 기록 관리: 작업자별 카드 ── */
  .manage-card { margin-bottom: 12px; }
  .manage-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: 900;
  }
  .manage-card-count { font-size: 12px; font-weight: 700; color: var(--text-dim); }

  .manage-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .manage-row:last-child { border-bottom: none; padding-bottom: 0; }
  .manage-row-info { flex: 1; min-width: 0; }
  .manage-row-name { font-size: 14px; font-weight: 700; }
  .manage-row-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .manage-row-qty { font-size: 14px; font-weight: 900; color: var(--orange); white-space: nowrap; }

  .export-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .export-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 최근 입력 원터치 ── */
  .recent-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .recent-btn {
    padding: 10px 14px;
    border: 1.5px solid rgba(255,107,43,0.4);
    border-radius: 20px;
    background: rgba(255,107,43,0.08);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .recent-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 규격 선택 그리드 ── */
  .spec-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .spec-btn {
    padding: 20px 8px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--steel-mid);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .spec-btn:hover { border-color: var(--orange); transform: translateY(-1px); }

  .chev { color: var(--text-dim); font-weight: 900; margin-left: 6px; }
  .group-count { font-size: 11px; color: var(--text-dim); }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--give);
    color: #0a1a0f;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px; font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toast" id="toast">✅ 저장 완료!</div>

<header class="site-header">
  <a href="https://praiselab.net/" class="brand">
    <div class="brand-icon">🏕️</div>
    Praiselab
  </a>
  <button class="whoami" id="whoami" onclick="changeWorker()" style="display:none;"></button>
</header>

<div class="container">

  <!-- ① 이름 선택 -->
  <div class="view" id="view-worker">
    <header class="page-head">
      <span class="header-icon">📋</span>
      <h1>물량작성</h1>
      <div class="page-sub">이름을 선택하고 시작하세요</div>
      <div class="sync-indicator"><span class="sync-dot"></span>실시간 공유 중</div>
    </header>

    <div class="card">
      <div class="section-label">작업자 선택</div>
      <div class="worker-list" id="worker-list"></div>
      <div style="margin-top:12px;">
        <div class="add-row" style="margin-top:0;">
          <input type="text" id="new-worker" placeholder="이름" />
          <input type="password" id="new-worker-pw" class="pw-field" inputmode="numeric" maxlength="4" placeholder="비번" onkeydown="if(event.key==='Enter')addWorker();" />
          <button class="add-btn" id="add-worker-btn" onclick="addWorker()">+ 등록</button>
        </div>
        <div id="admin-register-row" style="display:none;margin-top:10px;padding:0 2px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);cursor:pointer;">
            <input type="checkbox" id="new-worker-admin" /> 관리자로 등록
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- ② 홈: 대분류 -->
  <div class="view" id="view-home">
    <header class="page-head">
      <span class="header-icon">📋</span>
      <h1>물량작성</h1>
      <div class="sync-indicator"><span class="sync-dot"></span>실시간 공유 중</div>
    </header>

    <button class="summary-link-btn" onclick="openManage()">🗂 전체 기록 관리</button>
    <button class="summary-link-btn" onclick="openSummary()">📊 합산 보기</button>

    <div id="recent-wrap" style="display:none;">
      <div class="section-label">⚡ 최근 입력 — 누르면 바로 수량 입력</div>
      <div class="recent-list" id="recent-list"></div>
    </div>

    <div class="section-label">작업 대분류 선택</div>
    <div class="cat-grid" id="cat-grid"></div>

    <div class="section-label" style="margin-top:24px;">오늘 입력한 물량</div>
    <div class="entry-list" id="today-list"></div>
  </div>

  <!-- ③ 자재 목록 -->
  <div class="view" id="view-items">
    <div class="view-head">
      <button class="back-btn" onclick="itemsBack()">‹</button>
      <h2 id="items-title"></h2>
    </div>

    <input type="text" class="search-input" id="item-search" placeholder="자재 검색" oninput="renderItems()" />

    <div class="item-list" id="item-list"></div>

    <div class="card" style="margin-top:14px;">
      <div class="section-label">목록에 없어요?</div>
      <div class="add-row" style="margin-top:0;">
        <input type="text" id="new-item" placeholder="자재명 입력 (예: 새들 22mm)" />
        <button class="add-btn" id="add-item-btn" onclick="addItem()">+ 추가</button>
      </div>
    </div>
  </div>

  <!-- ③-b 규격 선택 -->
  <div class="view" id="view-spec">
    <div class="view-head">
      <button class="back-btn" onclick="specBack()">‹</button>
      <h2 id="spec-title"></h2>
    </div>
    <div class="section-label" id="spec-step-label"></div>
    <div class="spec-grid" id="spec-grid"></div>
  </div>

  <!-- ④ 수량 입력 -->
  <div class="view" id="view-entry">
    <div class="view-head">
      <button class="back-btn" onclick="history.back()">‹</button>
      <h2 id="entry-title"></h2>
    </div>

    <div class="card">
      <div class="field">
        <label id="entry-qty-label">수량</label>
        <input type="number" id="entry-qty" inputmode="decimal" step="0.1" min="0" placeholder="0" />
      </div>
      <button class="submit-btn" id="entry-save-btn" onclick="saveEntry()">저장 →</button>
    </div>
  </div>

  <!-- ⑤ 합산 보기 -->
  <div class="view" id="view-summary">
    <div class="view-head">
      <button class="back-btn" onclick="history.back()">‹</button>
      <h2>합산 보기</h2>
    </div>

    <div class="card">
      <div class="date-range-row">
        <div class="field" style="margin-bottom:0;">
          <label>시작일</label>
          <input type="date" id="summary-start" onchange="renderSummary()" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>종료일</label>
          <input type="date" id="summary-end" onchange="renderSummary()" />
        </div>
      </div>
    </div>

    <div class="section-label">자재별 합계</div>
    <div class="summary-list" id="summary-list"></div>

    <button class="export-btn" onclick="shareSummary()">📤 공유하기</button>
  </div>

  <!-- ⑥ 전체 기록 관리 -->
  <div class="view" id="view-manage">
    <div class="view-head">
      <button class="back-btn" onclick="history.back()">‹</button>
      <h2>전체 기록 관리</h2>
    </div>

    <div class="card">
      <div class="field">
        <label>작업자</label>
        <select class="field-select" id="manage-worker" onchange="renderManage()"></select>
      </div>
      <div class="date-range-row">
        <div class="field" style="margin-bottom:0;">
          <label>시작일</label>
          <input type="date" id="manage-start" onchange="renderManage()" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>종료일</label>
          <input type="date" id="manage-end" onchange="renderManage()" />
        </div>
      </div>
    </div>

    <div class="section-label">기록 목록</div>
    <div class="entry-list" id="manage-list"></div>
  </div>

  <!-- ⑦ 비밀번호 입력 -->
  <div class="view" id="view-password">
    <div class="view-head">
      <button class="back-btn" onclick="history.back()">‹</button>
      <h2 id="pw-worker-name"></h2>
    </div>
    <div class="card">
      <div class="section-label">비밀번호 4자리 입력</div>
      <div class="field">
        <input type="password" id="pw-input" inputmode="numeric" maxlength="4" placeholder="••••"
          onkeydown="if(event.key==='Enter')confirmPassword();" />
      </div>
      <button class="submit-btn" id="pw-confirm-btn" onclick="confirmPassword()">확인</button>
      <div id="pw-error" style="color:#ff4444;text-align:center;margin-top:14px;font-size:14px;display:none;">🔒 비밀번호가 맞지 않아요</div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAIPHUtjoIEjVDmgMgXD3-Moq5oz--2_xY",
    authDomain: "healingcamp-51eb0.firebaseapp.com",
    projectId: "healingcamp-51eb0",
  });

  const db = firebase.firestore();
  const colWorkers = db.collection('qty_workers');
  const colCategories = db.collection('qty_categories');
  const colItems = db.collection('qty_items');
  const colEntries = db.collection('qty_entries');

  // ── 기본 데이터 (Firestore가 비어 있으면 최초 1회 심는다) ──
  const DEFAULT_CATEGORIES = [
    { name: '트레이',     unit: 'M',  emoji: '🪜', order: 1 },
    { name: '덕트',       unit: 'M',  emoji: '📦', order: 2 },
    { name: '부스덕트',   unit: 'M',  emoji: '🔌', order: 3 },
    { name: '배관',       unit: 'M',  emoji: '🧵', order: 4 },
    { name: '레이스웨이', unit: 'M',  emoji: '🛤️', order: 5 },
    { name: '단말',       unit: 'EA', emoji: '🔗', order: 6 },
    { name: '기구설치',   unit: 'EA', emoji: '💡', order: 7 },
    { name: '기타',       unit: 'EA', emoji: '📁', order: 8 },
  ];

  const TRAY_WIDTHS = ['W100', 'W200', 'W300', 'W400', 'W600', 'W900', 'W1200'];
  const DEGREES = ['15°', '30°', '45°', '90°'];
  const STEEL_SIZES = ['16mm', '22mm', '28mm', '36mm', '42mm', '54mm'];
  const EMT_SIZES = ['E15', 'E19', 'E25', 'E31', 'E39', 'E51', 'E63', 'E75'];
  const RW_WIDTHS = ['70mm', '110mm'];
  const HFIX_SIZES = ['2.5sq', '4sq'];
  const HFIX_COLORS = ['흑', '백', '청', '녹', '적', '황'];
  const SQ_SIZES = ['1.5sq', '2sq', '4sq', '6sq', '10sq', '16sq', '35sq', '50sq', '75sq', '90sq', '120sq', '150sq', '240sq', '300sq'];

  function trayDuctTypes(category, withAccessories) {
    const types = [
      { category, name: '스트레이트', unit: 'M', hideTypeInName: true, spec1: { label: '폭', options: TRAY_WIDTHS }, order: 1 },
      { category, name: 'H-엘보', unit: 'EA', group: '피팅류', spec1: { label: '폭', options: TRAY_WIDTHS }, spec2: { label: '각도', options: DEGREES }, order: 2 },
      { category, name: 'V-엘보', unit: 'EA', group: '피팅류', spec1: { label: '폭', options: TRAY_WIDTHS }, spec2: { label: '각도', options: DEGREES }, order: 3 },
      { category, name: 'Cross', unit: 'EA', group: '피팅류', spec1: { label: '폭', options: TRAY_WIDTHS }, order: 4 },
    ];
    if (withAccessories) {
      types.push(
        { category, name: '본딩접지', unit: 'EA', order: 5 },
        { category, name: '홀다운클램프', unit: 'EA', order: 6 },
        { category, name: '이형조인트', unit: 'EA', order: 7 },
      );
    }
    return types;
  }

  const PIPE_ACCESSORIES = ['레듀샤', '환형박스', '풀박스', '곤지레다', '찬넬클램프', '원형클램프'];
  const ANGLE_SIZES = ['50mm', '75mm'];

  function angleType(category, order) {
    return { category, name: 'ㄱ앵글', unit: 'M', spec1: { label: '사이즈', options: ANGLE_SIZES }, order };
  }

  const BOLT_SIZES = ['산부(3/8)', '연부(1/2)'];

  function boltType(category, order) {
    return { category, name: '전산볼트', unit: 'EA', spec1: { label: '규격', options: BOLT_SIZES }, order };
  }

  const DEFAULT_TYPES = [
    ...trayDuctTypes('트레이', true),
    angleType('트레이', 8),
    boltType('트레이', 9),
    ...trayDuctTypes('덕트', false),
    angleType('덕트', 5),
    boltType('덕트', 6),
    angleType('부스덕트', 1),
    boltType('부스덕트', 2),
    { category: '배관', name: '강제전선관', unit: 'M', spec1: { label: '사이즈', options: STEEL_SIZES }, order: 1 },
    { category: '배관', name: 'EMT-무나사', unit: 'M', spec1: { label: '사이즈', options: EMT_SIZES }, order: 2 },
    ...PIPE_ACCESSORIES.map((n, i) => ({ category: '배관', name: n, unit: 'EA', spec1: { label: '사이즈', options: STEEL_SIZES }, order: 3 + i })),
    boltType('배관', 9),
    { category: '레이스웨이', name: '바디', unit: 'M', spec1: { label: '폭', options: RW_WIDTHS }, order: 1 },
    { category: '레이스웨이', name: '커버', unit: 'M', spec1: { label: '폭', options: RW_WIDTHS }, order: 2 },
    ...['엘보박스', 'T박스', 'Cross박스'].map((n, i) => ({ category: '레이스웨이', name: n, unit: 'EA', spec1: { label: '폭', options: RW_WIDTHS }, order: 3 + i })),
    { category: '레이스웨이', name: 'Offset', unit: 'EA', spec1: { label: '각도', options: DEGREES }, spec2: { label: '폭', options: RW_WIDTHS }, order: 6 },
    { category: '레이스웨이', name: 'HFIX', unit: 'M', spec1: { label: '굵기', options: HFIX_SIZES }, spec2: { label: '색상', options: HFIX_COLORS }, order: 7 },
    boltType('레이스웨이', 8),
    { category: '단말', name: '케이블', unit: 'M', spec1: { label: '굵기', options: SQ_SIZES }, order: 1 },
    { category: '단말', name: '터미널', unit: 'EA', spec1: { label: '굵기', options: SQ_SIZES }, order: 2 },
    { category: '단말', name: '터미널 (2홀)', unit: 'EA', spec1: { label: '굵기', options: ['120sq', '150sq', '240sq', '300sq'] }, order: 3 },
  ];

  // 기본 자재 판별: isDefault 필드가 있거나 DEFAULT_TYPES 목록에 포함된 것
  const DEFAULT_TYPE_KEYS = new Set(DEFAULT_TYPES.map(t => `${t.category}||${t.name}`));
  function isDefaultItem(item) {
    return item.isDefault === true || DEFAULT_TYPE_KEYS.has(`${item.category}||${item.name}`);
  }

  // ── 상태 ──
  let workers = [];
  let categories = [];
  let items = [];
  let entries = [];
  let currentWorker = localStorage.getItem('qty_worker') || '';
  let currentCategory = null;
  let currentItem = null;
  let currentType = null;
  let pickedSpec1 = null;
  let currentGroup = null;
  let pendingWorker = null; // 비밀번호 입력 대기 중인 작업자 객체
  let currentWorkerIsAdmin = false; // 로그아웃 후 작업자 전환 화면에서도 유지

  function isAdmin() {
    return currentWorkerIsAdmin;
  }

  function todayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── 화면 전환 ──
  function go(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  // ── 브라우저 히스토리 연동 ──
  function captureState(view) {
    return { view, category: currentCategory, group: currentGroup, type: currentType, specStep1: pickedSpec1, item: currentItem };
  }

  function pushHistory(view) {
    history.pushState(captureState(view), '');
  }

  function replaceHistory(view) {
    history.replaceState(captureState(view), '');
  }

  function applyState(state) {
    if (!state) return;
    currentCategory = state.category || null;
    currentGroup = state.group || null;
    currentType = state.type || null;
    pickedSpec1 = state.specStep1 || null;
    currentItem = state.item || null;

    switch (state.view) {
      case 'view-worker':
        go('view-worker');
        break;
      case 'view-home':
        renderTodayEntries();
        renderRecent();
        go('view-home');
        break;
      case 'view-items':
        if (currentCategory) {
          document.getElementById('items-title').textContent =
            currentGroup ? `${currentCategory.name} · ${currentGroup}` : currentCategory.name;
        }
        document.getElementById('item-search').value = '';
        renderItems();
        go('view-items');
        break;
      case 'view-spec':
        renderSpec();
        go('view-spec');
        break;
      case 'view-entry':
        if (currentItem) {
          document.getElementById('entry-title').textContent = currentItem.name;
          document.getElementById('entry-qty-label').textContent = `수량 (${currentItem.unit})`;
        }
        document.getElementById('entry-qty').value = '';
        go('view-entry');
        break;
      case 'view-summary':
        renderSummary();
        go('view-summary');
        break;
      case 'view-manage':
        renderManageWorkerOptions();
        renderManage();
        go('view-manage');
        break;
      case 'view-password':
        if (pendingWorker) {
          document.getElementById('pw-worker-name').textContent =
            (pendingWorker.isAdmin ? '⭐ ' : '👷 ') + pendingWorker.name;
          document.getElementById('pw-input').value = '';
          document.getElementById('pw-error').style.display = 'none';
          go('view-password');
        } else {
          go('view-worker');
          history.replaceState(captureState('view-worker'), '');
        }
        break;
      default:
        go('view-home');
    }
  }

  window.addEventListener('popstate', e => applyState(e.state));

  function updateWhoami() {
    const btn = document.getElementById('whoami');
    if (currentWorker) {
      btn.style.display = '';
      btn.textContent = (isAdmin() ? '⭐ ' : '👷 ') + currentWorker;
    } else {
      btn.style.display = 'none';
    }
    const adminRow = document.getElementById('admin-register-row');
    if (adminRow) adminRow.style.display = isAdmin() ? '' : 'none';
  }

  function changeWorker() {
    currentWorker = '';
    localStorage.removeItem('qty_worker');
    updateWhoami();
    renderWorkers();
    go('view-worker');
    pushHistory('view-worker');
  }

  // ── ① 작업자 ──
  function selectWorker(id) {
    const w = workers.find(x => x.id === id);
    if (!w) return;
    if (w.password) {
      pendingWorker = w;
      document.getElementById('pw-worker-name').textContent =
        (w.isAdmin ? '⭐ ' : '👷 ') + w.name;
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-error').style.display = 'none';
      go('view-password');
      pushHistory('view-password');
      setTimeout(() => document.getElementById('pw-input').focus(), 150);
    } else {
      loginWorker(w);
    }
  }

  function confirmPassword() {
    const input = document.getElementById('pw-input').value;
    if (!pendingWorker) return;
    if (input === pendingWorker.password) {
      loginWorker(pendingWorker);
      pendingWorker = null;
    } else {
      document.getElementById('pw-error').style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  function loginWorker(w) {
    currentWorker = w.name;
    currentWorkerIsAdmin = !!w.isAdmin;
    localStorage.setItem('qty_worker', w.name);
    updateWhoami();
    renderTodayEntries();
    renderRecent();
    go('view-home');
    pushHistory('view-home');
  }

  function showWorkerPw(pw) {
    alert('비밀번호: ' + (pw || '(없음)'));
  }

  function addWorker() {
    const nameInput = document.getElementById('new-worker');
    const pwInput = document.getElementById('new-worker-pw');
    const name = nameInput.value.trim();
    const password = pwInput.value.trim();

    if (!name) { alert('이름을 입력해주세요!'); return; }
    if (!password || !/^\d{4}$/.test(password)) {
      alert('비밀번호는 숫자 4자리로 입력해주세요!'); return;
    }
    if (workers.some(w => w.name === name)) { alert('이미 등록된 이름이에요.'); return; }

    const adminCheck = document.getElementById('new-worker-admin');
    const isAdminFlag = !!(adminCheck && isAdmin() && adminCheck.checked);

    const btn = document.getElementById('add-worker-btn');
    btn.disabled = true;
    colWorkers.add({
      name,
      password,
      isAdmin: isAdminFlag,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    })
      .then(() => {
        nameInput.value = '';
        pwInput.value = '';
        if (adminCheck) adminCheck.checked = false;
        showToast('✅ 등록 완료!');
      })
      .catch(() => alert('등록 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function deleteWorker(id, name) {
    if (!confirm(`'${name}' 이름을 삭제할까요?`)) return;
    colWorkers.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function renderWorkers() {
    const list = document.getElementById('worker-list');
    const adminRow = document.getElementById('admin-register-row');
    if (adminRow) adminRow.style.display = isAdmin() ? '' : 'none';

    if (!workers.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">👷</span>아직 등록된 이름이 없어요.<br>아래에서 이름을 등록해주세요.</div>';
      return;
    }
    list.innerHTML = workers.map(w => `
      <div class="worker-row">
        <button class="worker-btn" onclick="selectWorker('${w.id}')">
          ${w.isAdmin ? '⭐' : '👷'} ${escapeHtml(w.name)}
        </button>
        ${isAdmin() ? `<button class="pw-btn" onclick="showWorkerPw('${escapeHtml(w.password || '')}')">🔑</button>` : ''}
        <button class="del-btn" onclick="deleteWorker('${w.id}', '${escapeHtml(w.name)}')">✕</button>
      </div>
    `).join('');
  }

  // ── ② 대분류 ──
  function openCategory(name, unit) {
    currentCategory = { name, unit };
    currentGroup = null;
    document.getElementById('items-title').textContent = name;
    document.getElementById('item-search').value = '';
    renderItems();
    go('view-items');
    pushHistory('view-items');
  }

  function openGroup(name) {
    currentGroup = name;
    document.getElementById('items-title').textContent = `${currentCategory.name} · ${name}`;
    document.getElementById('item-search').value = '';
    renderItems();
    pushHistory('view-items');
  }

  function itemsBack() {
    history.back();
  }

  function renderCategories() {
    const grid = document.getElementById('cat-grid');
    if (!categories.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><span class="empty-icon">⏳</span>목록 불러오는 중…</div>';
      return;
    }
    grid.innerHTML = categories.map(c => `
      <button class="cat-btn" onclick="openCategory('${escapeHtml(c.name)}', '${escapeHtml(c.unit)}')">
        ${escapeHtml(c.name)}
        <span class="cat-unit">${escapeHtml(c.unit)} 단위</span>
      </button>
    `).join('');
  }

  // ── ③ 자재 ──
  function addItem() {
    const input = document.getElementById('new-item');
    const name = input.value.trim();
    if (!name) { alert('자재명을 입력해주세요!'); return; }
    if (items.some(i => i.category === currentCategory.name && i.name === name)) {
      alert('이미 등록된 자재예요.');
      return;
    }

    const btn = document.getElementById('add-item-btn');
    btn.disabled = true;
    colItems.add({
      category: currentCategory.name,
      name,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    })
      .then(() => { input.value = ''; showToast('✅ 자재 추가 완료! 팀 전체에 공유됐어요'); })
      .catch(() => alert('추가 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function selectItem(name, unit) {
    currentItem = { name, unit };
    document.getElementById('entry-title').textContent = name;
    document.getElementById('entry-qty-label').textContent = `수량 (${unit})`;
    document.getElementById('entry-qty').value = '';
    go('view-entry');
    pushHistory('view-entry');
    document.getElementById('entry-qty').focus();
  }

  // ── ③-b 종류 → 규격 선택 ──
  function composeItemName(type, s1, s2) {
    const parts = [];
    if (!type.hideTypeInName) parts.push(type.name);
    if (s1) parts.push(s1);
    if (s2) parts.push(s2);
    return parts.join(' ');
  }

  function selectType(typeId) {
    const type = items.find(t => t.id === typeId);
    if (!type) return;
    currentType = type;
    pickedSpec1 = null;
    const unit = type.unit || currentCategory.unit;

    if (!type.spec1) {
      selectItem(composeItemName(type), unit);
      return;
    }
    renderSpec();
    go('view-spec');
    pushHistory('view-spec');
  }

  function pickSpec(option) {
    const type = currentType;
    const unit = type.unit || currentCategory.unit;

    if (type.spec2 && pickedSpec1 === null) {
      pickedSpec1 = option;
      renderSpec();
      pushHistory('view-spec');
      return;
    }
    if (type.spec2) {
      selectItem(composeItemName(type, pickedSpec1, option), unit);
    } else {
      selectItem(composeItemName(type, option), unit);
    }
  }

  function specBack() {
    history.back();
  }

  function renderSpec() {
    const type = currentType;
    const onSpec2 = type.spec2 && pickedSpec1 !== null;
    const spec = onSpec2 ? type.spec2 : type.spec1;

    document.getElementById('spec-title').textContent =
      onSpec2 ? `${type.name} ${pickedSpec1}` : type.name;
    document.getElementById('spec-step-label').textContent = `${spec.label} 선택`;
    document.getElementById('spec-grid').innerHTML = spec.options.map(o => `
      <button class="spec-btn" onclick="pickSpec('${escapeHtml(o)}')">${escapeHtml(o)}</button>
    `).join('');
  }

  // ── 최근 입력 원터치 ──
  function renderRecent() {
    const wrap = document.getElementById('recent-wrap');
    if (!wrap) return;
    const seen = new Set();
    const recent = [];
    for (const e of entries) {
      if (e.worker !== currentWorker || seen.has(e.item)) continue;
      seen.add(e.item);
      recent.push(e);
      if (recent.length >= 5) break;
    }
    if (!recent.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    document.getElementById('recent-list').innerHTML = recent.map(e => `
      <button class="recent-btn" onclick="selectRecent('${escapeHtml(e.item)}', '${escapeHtml(e.unit)}', '${escapeHtml(e.category)}')">${escapeHtml(e.item)}</button>
    `).join('');
  }

  function selectRecent(name, unit, category) {
    const c = categories.find(x => x.name === category);
    currentCategory = { name: category, unit: c ? c.unit : unit };
    currentGroup = null;
    document.getElementById('items-title').textContent = category;
    document.getElementById('item-search').value = '';
    renderItems();
    selectItem(name, unit);
  }

  function typeButtonHtml(t) {
    const unit = t.unit || currentCategory.unit;
    const canDel = !isDefaultItem(t);
    return `
      <div class="item-row">
        <button class="item-btn" onclick="selectType('${t.id}')">
          ${escapeHtml(t.name)}
          <span><span class="item-unit">${escapeHtml(unit)}</span>${t.spec1 ? '<span class="chev">›</span>' : ''}</span>
        </button>
        ${canDel ? `<button class="del-btn" onclick="deleteItem('${t.id}', '${escapeHtml(t.name)}')">✕</button>` : ''}
      </div>
    `;
  }

  function deleteItem(id, name) {
    if (!confirm(`'${name}' 자재를 삭제할까요? 지금까지 입력된 물량 기록은 그대로 남아요.`)) return;
    colItems.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function renderItems() {
    if (!currentCategory) return;
    const list = document.getElementById('item-list');
    const keyword = document.getElementById('item-search').value.trim();
    const inCategory = items.filter(i => i.category === currentCategory.name);

    if (keyword) {
      const found = inCategory.filter(i => i.name.includes(keyword));
      if (!found.length) {
        list.innerHTML = '<div class="empty-state"><span class="empty-icon">🗂️</span>검색 결과가 없어요</div>';
        return;
      }
      found.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, 'ko'));
      list.innerHTML = found.map(typeButtonHtml).join('');
      return;
    }

    if (currentGroup) {
      const grouped = inCategory.filter(i => i.group === currentGroup);
      grouped.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, 'ko'));
      list.innerHTML = grouped.map(typeButtonHtml).join('');
      return;
    }

    const top = inCategory.filter(i => !i.group);
    const groupNames = [...new Set(inCategory.filter(i => i.group).map(i => i.group))];

    if (!top.length && !groupNames.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">🗂️</span>등록된 자재가 없어요.<br>아래에서 추가해주세요.</div>';
      return;
    }

    top.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, 'ko'));

    const groupButtons = groupNames.map(g => {
      const count = inCategory.filter(i => i.group === g).length;
      return `
        <button class="item-btn" onclick="openGroup('${escapeHtml(g)}')">
          🗂 ${escapeHtml(g)}
          <span><span class="group-count">${count}종</span><span class="chev">›</span></span>
        </button>
      `;
    });

    list.innerHTML = top.map(typeButtonHtml).join('') + groupButtons.join('');
  }

  // ── ④ 수량 입력 ──
  function saveEntry() {
    const qtyInput = document.getElementById('entry-qty');
    const qty = parseFloat(qtyInput.value);
    if (!qty || qty <= 0) { alert('수량을 입력해주세요!'); return; }

    const btn = document.getElementById('entry-save-btn');
    btn.disabled = true;
    colEntries.add({
      worker: currentWorker,
      category: currentCategory.name,
      item: currentItem.name,
      unit: currentItem.unit,
      qty,
      date: todayStr(),
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    })
      .then(() => {
        showToast(`✅ ${currentItem.name} ${qty}${currentItem.unit} 저장 완료!`);
        go('view-items');
        replaceHistory('view-items');
      })
      .catch(() => alert('저장 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function deleteEntry(id) {
    if (!confirm('이 입력 내역을 삭제할까요?')) return;
    colEntries.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function renderTodayEntries() {
    const list = document.getElementById('today-list');
    if (!list) return;
    const today = todayStr();
    const mine = entries.filter(e => e.worker === currentWorker && e.date === today);

    if (!mine.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">📋</span>아직 입력한 물량이 없어요</div>';
      return;
    }

    list.innerHTML = mine.map(e => `
      <div class="entry-card">
        <div class="entry-info">
          <div class="entry-name">${escapeHtml(e.item)}</div>
          <div class="entry-meta">${escapeHtml(e.category)}</div>
        </div>
        <div class="entry-qty">${e.qty}${escapeHtml(e.unit)}</div>
        <button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button>
      </div>
    `).join('');
  }

  // ── ⑤ 합산 보기 ──
  function openSummary() {
    const today = todayStr();
    document.getElementById('summary-start').value = today;
    document.getElementById('summary-end').value = today;
    renderSummary();
    go('view-summary');
    pushHistory('view-summary');
  }

  function formatQty(n) {
    return Math.round(n * 100) / 100;
  }

  function getSummaryData() {
    const start = document.getElementById('summary-start').value || todayStr();
    const end = document.getElementById('summary-end').value || todayStr();
    const filtered = entries.filter(e => e.date >= start && e.date <= end);

    const map = new Map();
    filtered.forEach(e => {
      const key = `${e.category}||${e.item}||${e.unit}`;
      if (!map.has(key)) map.set(key, { category: e.category, item: e.item, unit: e.unit, qty: 0 });
      map.get(key).qty += e.qty;
    });

    const catOrder = new Map(categories.map(c => [c.name, c.order]));
    return [...map.values()].sort((a, b) => {
      const oa = catOrder.get(a.category) ?? 999;
      const ob = catOrder.get(b.category) ?? 999;
      if (oa !== ob) return oa - ob;
      return a.item.localeCompare(b.item, 'ko');
    });
  }

  function renderSummary() {
    const list = document.getElementById('summary-list');
    const rows = getSummaryData();

    if (!rows.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">📊</span>선택한 기간에 입력된 물량이 없어요</div>';
      return;
    }

    let currentCat = null;
    let html = '';
    rows.forEach(r => {
      if (r.category !== currentCat) {
        currentCat = r.category;
        html += `<div class="summary-group-title">${escapeHtml(currentCat)}</div>`;
      }
      html += `
        <div class="summary-row">
          <span class="summary-item-name">${escapeHtml(r.item)}</span>
          <span class="summary-qty">${formatQty(r.qty)}${escapeHtml(r.unit)}</span>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  function buildSummaryCSVBlob(rows) {
    const header = '대분류,자재명,단위,합계수량\n';
    const body = rows.map(r => `${r.category},${r.item},${r.unit},${formatQty(r.qty)}`).join('\n');
    return new Blob(['﻿' + header + body], { type: 'text/csv;charset=utf-8;' });
  }

  function buildSummaryText(rows, start, end) {
    let text = `📊 물량 합산 (${start} ~ ${end})\n`;
    let cat = null;
    rows.forEach(r => {
      if (r.category !== cat) { cat = r.category; text += `\n[${cat}]\n`; }
      text += `${r.item} ${formatQty(r.qty)}${r.unit}\n`;
    });
    return text.trim();
  }

  async function shareSummary() {
    const rows = getSummaryData();
    if (!rows.length) { alert('공유할 데이터가 없어요!'); return; }
    const start = document.getElementById('summary-start').value;
    const end = document.getElementById('summary-end').value;
    const fileName = `물량합산_${start}_${end}.csv`;
    const file = new File([buildSummaryCSVBlob(rows)], fileName, { type: 'text/csv' });
    const text = buildSummaryText(rows, start, end);

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '물량 합산', text });
      } catch (e) {
        if (e.name !== 'AbortError') alert('공유에 실패했어요.');
      }
      return;
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: '물량 합산', text });
      } catch (e) {
        if (e.name !== 'AbortError') alert('공유에 실패했어요.');
      }
      return;
    }
    alert('이 브라우저는 공유하기를 지원하지 않아요.');
  }

  // ── ⑥ 전체 기록 관리 ──
  function openManage() {
    const today = todayStr();
    document.getElementById('manage-start').value = today;
    document.getElementById('manage-end').value = today;
    renderManageWorkerOptions();
    renderManage();
    go('view-manage');
    pushHistory('view-manage');
  }

  function renderManageWorkerOptions() {
    const sel = document.getElementById('manage-worker');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '<option value="">전체 작업자</option>' +
      workers.map(w => `<option value="${escapeHtml(w.name)}">${escapeHtml(w.name)}</option>`).join('');
    sel.value = prev;
  }

  function renderManage() {
    const list = document.getElementById('manage-list');
    if (!list) return;
    const worker = document.getElementById('manage-worker').value;
    const start = document.getElementById('manage-start').value || todayStr();
    const end = document.getElementById('manage-end').value || todayStr();
    const filtered = entries.filter(e =>
      e.date >= start && e.date <= end && (!worker || e.worker === worker)
    );

    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">🗂️</span>선택한 조건에 기록이 없어요</div>';
      return;
    }

    const groups = new Map();
    filtered.forEach(e => {
      if (!groups.has(e.worker)) groups.set(e.worker, []);
      groups.get(e.worker).push(e);
    });

    let html = '';
    groups.forEach((rows, workerName) => {
      html += `
        <div class="card manage-card">
          <div class="manage-card-header">
            <span>👷 ${escapeHtml(workerName)}</span>
            <span class="manage-card-count">${rows.length}건</span>
          </div>
          ${rows.map(e => {
            const canDel = isAdmin() || e.worker === currentWorker;
            return `
            <div class="manage-row">
              <div class="manage-row-info">
                <div class="manage-row-name">${escapeHtml(e.item)}</div>
                <div class="manage-row-meta">${escapeHtml(e.category)} · ${escapeHtml(e.date)}</div>
              </div>
              <div class="manage-row-qty">${e.qty}${escapeHtml(e.unit)}</div>
              ${canDel ? `<button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button>` : '<div style="width:38px;flex-shrink:0;"></div>'}
            </div>
          `;
          }).join('')}
        </div>
      `;
    });
    list.innerHTML = html;
  }

  // ── 최초 1회 기본 데이터 심기 ──
  function seedIfEmpty() {
    const lockRef = colCategories.doc('_seed_lock');
    db.runTransaction(tx => tx.get(lockRef).then(lockSnap => {
      if (lockSnap.exists) return;
      tx.set(lockRef, { seededAt: firebase.firestore.FieldValue.serverTimestamp() });
      DEFAULT_CATEGORIES.forEach(c => tx.set(colCategories.doc(), c));
      DEFAULT_TYPES.forEach(t => tx.set(colItems.doc(), {
        ...t,
        isDefault: true,
        ts: firebase.firestore.FieldValue.serverTimestamp(),
      }));
    })).catch(() => {});
  }

  // 관리자 계정 사전 등록 (한 번만)
  function seedAdmin() {
    const lockRef = colWorkers.doc('_admin_seed');
    db.runTransaction(tx => tx.get(lockRef).then(snap => {
      if (snap.exists) return;
      tx.set(lockRef, { at: firebase.firestore.FieldValue.serverTimestamp() });
      tx.set(colWorkers.doc(), {
        name: '김찬양',
        password: '2540',
        isAdmin: true,
        ts: firebase.firestore.FieldValue.serverTimestamp(),
      });
    })).catch(() => {});
  }

  // ── 실시간 리스너 ──
  colWorkers.orderBy('name').onSnapshot(snap => {
    workers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // 새로고침 후 관리자 상태 복원
    if (currentWorker) {
      const w = workers.find(x => x.name === currentWorker);
      currentWorkerIsAdmin = !!(w && w.isAdmin);
    }
    renderWorkers();
    renderManageWorkerOptions();
    updateWhoami();
  }, () => {
    document.getElementById('worker-list').innerHTML =
      '<div class="empty-state"><span class="empty-icon">⚠️</span>연결 오류. 새로고침 해주세요.</div>';
  });

  colCategories.orderBy('order').onSnapshot(snap => {
    categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCategories();
  });

  colItems.orderBy('name').onSnapshot(snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderItems();
  });

  colEntries.orderBy('ts', 'desc').onSnapshot(snap => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTodayEntries();
    renderRecent();
    renderManage();
  });

  // ── 시작 ──
  seedIfEmpty();
  seedAdmin();
  updateWhoami();
  const initialView = currentWorker ? 'view-home' : 'view-worker';
  go(initialView);
  history.replaceState(captureState(initialView), '');
</script>
</body>
</html>

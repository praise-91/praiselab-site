<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공구·자재 대여 기록</title>
<script>
  // 저장된 테마를 CSS 그리기 전에 먼저 적용해서 어두운 화면이 잠깐 번쩍이는 걸 방지
  (function () {
    var t = localStorage.getItem('feederTheme');
    if (t !== 'dark') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #1A1E2E;
    --steel-mid: #252A3D;
    --steel-light: #2E3450;
    --text: #F0F2FF;
    --text-dim: #8892B0;
    --give: #3BE88A;
    --take: #FF6B2B;
    --border: rgba(255,255,255,0.08);
    --header-bg: rgba(26, 30, 46, 0.8);
  }

  :root[data-theme="light"] {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #F4F3F0;
    --steel-mid: #FFFFFF;
    --steel-light: #F0EFEA;
    --text: #1C1E27;
    --text-dim: #767A85;
    --give: #1E8E56;
    --take: #FF6B2B;
    --border: rgba(0,0,0,0.08);
    --header-bg: rgba(244, 243, 240, 0.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--steel);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,107,43,0.04) 39px, rgba(255,107,43,0.04) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,107,43,0.04) 39px, rgba(255,107,43,0.04) 40px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    padding: 32px 0 28px;
  }

  .header-icon {
    font-size: 40px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(255,107,43,0.5));
  }

  header h1 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .form-card {
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .toggle-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 24px;
  }

  .toggle-btn {
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--steel-light);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .toggle-btn span.emoji { font-size: 22px; }

  .toggle-btn.give.active {
    background: rgba(59,232,138,0.12);
    border-color: var(--give);
    color: var(--give);
  }

  .toggle-btn.take.active {
    background: rgba(255,107,43,0.12);
    border-color: var(--take);
    color: var(--take);
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--steel-light);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .field input:focus { border-color: var(--orange); }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--orange);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: -0.3px;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .submit-btn:hover { background: var(--orange-dark); transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--give);
    color: #0a1a0f;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    z-index: 999;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 탭 */
  .tab-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--steel-mid);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .tab-btn.active {
    background: rgba(255,107,43,0.12);
    border-color: var(--orange);
    color: var(--text);
  }

  .tab-count {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
  }

  .tab-btn.active .tab-count {
    background: var(--orange);
    color: white;
  }

  .clear-btn {
    font-size: 12px;
    color: #ff4444;
    background: none;
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .clear-btn:hover { background: rgba(255,68,68,0.1); }

  .record-list { display: flex; flex-direction: column; gap: 10px; }

  /* 카드 */
  .record-card {
    background: var(--steel-mid);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    animation: slideIn 0.3s ease;
    transition: opacity 0.3s;
  }

  .record-card.returned {
    opacity: 0.6;
  }

  .card-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .return-btn {
    flex: 1;
    padding: 7px 0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid rgba(59,232,138,0.4);
    background: rgba(59,232,138,0.06);
    color: var(--give);
  }

  .return-btn:hover { background: rgba(59,232,138,0.15); }

  .return-btn.is-returned {
    border-color: rgba(136,146,176,0.3);
    background: transparent;
    color: var(--text-dim);
  }

  .return-btn.is-returned:hover { background: rgba(255,255,255,0.04); }

  .delete-btn {
    padding: 7px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid rgba(255,68,68,0.25);
    background: transparent;
    color: rgba(255,68,68,0.5);
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: rgba(255,68,68,0.1);
    color: #ff4444;
    border-color: rgba(255,68,68,0.5);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .record-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-give { background: rgba(59,232,138,0.15); color: var(--give); }
  .badge-take { background: rgba(255,107,43,0.15); color: var(--take); }

  .record-info { flex: 1; min-width: 0; }

  .record-item {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    word-break: break-all;
  }

  .record-meta {
    font-size: 12px;
    color: var(--text-dim);
  }

  .record-time {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .empty-state .empty-icon { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.4; }

  .export-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .export-btn:hover { border-color: var(--orange); color: var(--orange); }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
  .loading-brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

  /* ── 로그인 필요 화면 ── */
  .locked-wrap { text-align: center; padding: 60px 20px; }
  .locked-icon { font-size: 40px; display: block; margin-bottom: 16px; }
  .locked-msg { font-size: 15px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.6; }
  .locked-link {
    display: inline-block;
    padding: 14px 28px;
    background: #fff;
    border-radius: 12px;
    color: var(--orange);
    text-decoration: none;
    font-weight: 900;
  }
  .locked-link:hover { background: rgba(255,107,43,0.08); }

  /* 상단 네비 */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .hamburger-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 사이드 메뉴 ── */
  .menu-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5);
    justify-content: flex-end;
  }
  .menu-overlay.show { display: flex; }
  .menu-sheet {
    width: 78%; max-width: 300px; height: 100%;
    background: var(--steel-mid);
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column;
    animation: menuSlideIn 0.22s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes menuSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .menu-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .menu-title { font-size: 15px; font-weight: 900; color: var(--text-dim); letter-spacing: 0.5px; }
  .menu-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  .menu-close:hover { color: var(--orange); }
  .theme-quickswitch { display:inline-flex; border-radius:16px; background:var(--steel-light); border:1px solid var(--border); padding:2px; gap:2px; }
  .theme-quickswitch-opt {
    width: 26px; height: 26px; display:flex; align-items:center; justify-content:center;
    font-size: 12px; border-radius: 12px; border: none; background: transparent;
    cursor: pointer; opacity: 0.4;
  }
  .theme-quickswitch-opt.is-active { background: var(--orange); opacity: 1; }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-radius: 12px;
    background: none; border: none;
    color: var(--text); font-family: inherit;
    font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; width: 100%;
  }
  .menu-item:hover { background: var(--steel-light); }
  .menu-item-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-item--logout { margin-top: auto; color: #ff8a8a; }

  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .brand:hover { opacity: 0.75; }

  .brand-icon {
    width: 26px;
    height: 26px;
    background: linear-gradient(135deg, #FF6B2E, #FFB347);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .sync-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--give);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="toast" id="toast">✅ 기록 저장 완료!</div>

<header class="site-header">
  <a href="https://praiselab.net/tools/" class="brand">
    Feeder
  </a>
  <button class="hamburger-btn" id="hamburger-btn" onclick="openMenu()" style="display:none;" aria-label="메뉴">☰</button>
</header>

<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()">
  <div class="menu-sheet" onclick="event.stopPropagation()">
    <div class="menu-head">
      <span class="menu-title">메뉴</span>
      <div style="display:flex; align-items:center; gap:2px;">
        <div class="theme-quickswitch" onclick="event.stopPropagation()">
          <button class="theme-quickswitch-opt" id="theme-quick-dark" onclick="setTheme('dark')" aria-label="다크 테마">🌙</button>
          <button class="theme-quickswitch-opt" id="theme-quick-light" onclick="setTheme('light')" aria-label="화이트 테마">☀️</button>
        </div>
        <button class="menu-close" onclick="closeMenu()" aria-label="닫기">✕</button>
      </div>
    </div>
    <button class="menu-item" id="menu-admin" onclick="closeMenu(); location.href='index.html?admin=1';" style="display:none;">
      <span class="menu-item-icon">🔑</span><span>팀장 기능</span>
    </button>
    <button class="menu-item menu-item--logout" onclick="closeMenu(); logout();">
      <span class="menu-item-icon">🚪</span><span>로그아웃</span>
    </button>
  </div>
</div>

<div class="container">

  <div class="loading-brand" id="view-loading">
    <div class="loading-brand-title">Feeder</div>
    <div class="loading-brand-sub">불러오는 중…</div>
  </div>

  <div class="locked-wrap" id="view-locked" style="display:none;">
    <span class="locked-icon">🔒</span>
    <div class="locked-msg">로그인이 필요해요.<br>피더 홈에서 로그인 후 다시 들어와주세요.</div>
    <a href="index.html?login=1" class="locked-link">로그인하러 가기 →</a>
  </div>

  <div id="view-app" style="display:none;">
    <div class="form-card">
      <div class="toggle-wrap">
        <button class="toggle-btn give active" id="btn-give" onclick="setType('give')">
          <span class="emoji">📤</span>
          빌려줬어요
        </button>
        <button class="toggle-btn take" id="btn-take" onclick="setType('take')">
          <span class="emoji">📥</span>
          빌려왔어요
        </button>
      </div>

      <div class="field">
        <label>상대 팀명</label>
        <input type="text" id="team" />
      </div>

      <div class="field">
        <label id="name-label">빌려준 사람 이름</label>
        <input type="text" id="person" />
      </div>

      <div class="field">
        <label>물건 이름</label>
        <input type="text" id="item" />
      </div>

      <button class="submit-btn" id="submit-btn" onclick="save()">기록 저장 →</button>
    </div>

    <div class="tab-wrap">
      <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
        대여중 <span class="tab-count" id="count-active">0</span>
      </button>
      <button class="tab-btn" id="tab-returned" onclick="switchTab('returned')">
        반납완료 <span class="tab-count" id="count-returned">0</span>
      </button>
      <button class="clear-btn" onclick="clearAll()">삭제</button>
    </div>

    <div class="record-list" id="record-list"></div>

    <button class="export-btn" onclick="shareRecords()">📤 공유하기</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAIPHUtjoIEjVDmgMgXD3-Moq5oz--2_xY",
    authDomain: "healingcamp-51eb0.firebaseapp.com",
    projectId: "healingcamp-51eb0",
  });
  // 2026-07-14 App Check 도입: index.html과 동일한 이유(스크립트 기반 도배/가입 공격 방지)
  firebase.appCheck().activate(
    new firebase.appCheck.ReCaptchaV3Provider('6LeODVMtAAAAANkeTWgPXGpHO168GqdwwMFQzh7J'),
    true
  );

  const auth = firebase.auth();
  const db = firebase.firestore();
  const col = db.collection('tool_rentals');

  function openMenu() { document.getElementById('menu-overlay').classList.add('show'); }
  function closeMenu() { document.getElementById('menu-overlay').classList.remove('show'); }
  function logout() { auth.signOut(); }

  function updateHamburger() {
    document.getElementById('hamburger-btn').style.display = '';
    document.getElementById('menu-admin').style.display = isAdminFlag ? '' : 'none';
  }
  function hideHamburger() {
    isAdminFlag = false;
    document.getElementById('hamburger-btn').style.display = 'none';
    closeMenu();
  }

  // ── 피더 로그인 게이트: 승인된 사람만 통과 ──
  let appStarted = false;
  let gateProfileUnsub = null;
  let isAdminFlag = false;

  function startApp() {
    if (appStarted) return;
    appStarted = true;
    document.getElementById('view-loading').style.display = 'none';
    document.getElementById('view-locked').style.display = 'none';
    document.getElementById('view-app').style.display = '';
    initRentalApp();
  }

  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }
    if (!user) {
      hideHamburger();
      document.getElementById('view-loading').style.display = 'none';
      document.getElementById('view-locked').style.display = '';
      document.getElementById('view-app').style.display = 'none';
      return;
    }
    gateProfileUnsub = db.collection('tools_users').doc(user.uid).onSnapshot(doc => {
      if (doc.exists && doc.data().status === 'approved') {
        isAdminFlag = !!doc.data().isAdmin;
        updateHamburger();
        startApp();
      } else {
        hideHamburger();
        document.getElementById('view-loading').style.display = 'none';
        document.getElementById('view-locked').style.display = '';
        document.getElementById('view-app').style.display = 'none';
      }
    });
  });

  let type = 'give';
  let records = [];
  let activeTab = 'active';

  function setType(t) {
    type = t;
    document.getElementById('btn-give').classList.toggle('active', t === 'give');
    document.getElementById('btn-take').classList.toggle('active', t === 'take');
    document.getElementById('name-label').textContent =
      t === 'give' ? '빌려준 사람 이름' : '빌려온 사람 이름';
  }

  function save() {
    const team = document.getElementById('team').value.trim();
    const person = document.getElementById('person').value.trim();
    const item = document.getElementById('item').value.trim();

    if (!team || !person || !item) {
      alert('팀명, 이름, 물건 이름을 모두 입력해주세요!');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    col.add({
      type,
      team,
      person,
      item,
      returned: false,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    })
    .then(() => {
      document.getElementById('team').value = '';
      document.getElementById('person').value = '';
      document.getElementById('item').value = '';
      showToast();
    })
    .catch(() => alert('저장 실패. 인터넷 연결을 확인해주세요.'))
    .finally(() => { btn.disabled = false; });
  }

  const TOAST_DEFAULT_MSG = document.getElementById('toast').textContent;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || TOAST_DEFAULT_MSG;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── 테마 ──
  let currentTheme = localStorage.getItem('feederTheme') === 'dark' ? 'dark' : 'light';
  function setTheme(t) {
    currentTheme = t;
    localStorage.setItem('feederTheme', t);
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    renderSettings();
  }
  function renderSettings() {
    document.getElementById('theme-quick-dark').classList.toggle('is-active', currentTheme !== 'light');
    document.getElementById('theme-quick-light').classList.toggle('is-active', currentTheme === 'light');
  }
  renderSettings();

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-active').classList.toggle('active', tab === 'active');
    document.getElementById('tab-returned').classList.toggle('active', tab === 'returned');
    render();
  }

  function toggleReturn(id, isReturned) {
    col.doc(id).update({ returned: !isReturned })
      .catch(() => alert('변경 실패. 다시 시도해주세요.'));
  }

  function deleteOne(id) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    col.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function clearAll() {
    const targets = records.filter(r => activeTab === 'active' ? !r.returned : r.returned);
    if (!targets.length) return;
    const label = activeTab === 'active' ? '대여중' : '반납완료';
    if (!confirm(`${label} 기록을 전부 삭제할까요?`)) return;

    const batch = db.batch();
    targets.forEach(r => batch.delete(col.doc(r.id)));
    batch.commit().catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  // 사용자 입력을 innerHTML에 넣기 전 반드시 이 함수를 거친다 (XSS 방지)
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTime(ts) {
    if (!ts) return '저장 중…';
    const d = ts.toDate();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${mm}/${dd} ${hh}:${min}`;
  }

  function render() {
    const list = document.getElementById('record-list');
    const activeRecords = records.filter(r => !r.returned);
    const returnedRecords = records.filter(r => r.returned);

    document.getElementById('count-active').textContent = activeRecords.length;
    document.getElementById('count-returned').textContent = returnedRecords.length;

    const filtered = activeTab === 'active' ? activeRecords : returnedRecords;

    if (!filtered.length) {
      const msg = activeTab === 'active' ? '대여 중인 항목이 없어요' : '반납완료된 항목이 없어요';
      list.innerHTML = `<div class="empty-state"><span class="empty-icon">🗂️</span>${msg}</div>`;
      return;
    }

    list.innerHTML = filtered.map(r => `
      <div class="record-card ${r.returned ? 'returned' : ''}">
        <div class="card-top">
          <span class="record-badge ${r.type === 'give' ? 'badge-give' : 'badge-take'}">
            ${r.type === 'give' ? '📤 빌려줌' : '📥 빌려옴'}
          </span>
          <div class="record-info">
            <div class="record-item">🔩 ${escapeHtml(r.item)}</div>
            <div class="record-meta">${escapeHtml(r.team)} · ${escapeHtml(r.person)}</div>
          </div>
          <div class="record-time">${formatTime(r.ts)}</div>
        </div>
        <div class="card-actions">
          <button class="return-btn ${r.returned ? 'is-returned' : ''}"
            onclick="toggleReturn('${r.id}', ${r.returned})">
            ${r.returned ? '↩ 반납취소' : '✅ 반납완료'}
          </button>
          <button class="delete-btn" onclick="deleteOne('${r.id}')">🗑</button>
        </div>
      </div>
    `).join('');
  }

  function buildRecordsCSVBlob(rows) {
    // 쉼표·따옴표·줄바꿈이 든 값은 따옴표로 감싸야 열이 밀리지 않는다
    const csvField = v => {
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const header = '구분,팀명,이름,물건,시간,반납여부\n';
    const body = rows.map(r =>
      [
        r.type === 'give' ? '빌려줌' : '빌려옴',
        r.team,
        r.person,
        r.item,
        formatTime(r.ts),
        r.returned ? '반납완료' : '대여중',
      ].map(csvField).join(',')
    ).join('\n');
    return new Blob(['﻿' + header + body], { type: 'text/csv;charset=utf-8;' });
  }

  function buildRecordsText(rows) {
    let text = '🔧 공구·자재 대여 기록\n';
    rows.forEach(r => {
      text += `${r.type === 'give' ? '📤 빌려줌' : '📥 빌려옴'} ${r.item} - ${r.team} ${r.person} (${r.returned ? '반납완료' : '대여중'})\n`;
    });
    return text.trim();
  }

  async function shareRecords() {
    if (!records.length) { alert('공유할 데이터가 없어요!'); return; }
    const fileName = '공구대여기록.csv';
    const file = new File([buildRecordsCSVBlob(records)], fileName, { type: 'text/csv' });
    const text = buildRecordsText(records);

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '공구·자재 대여 기록', text });
      } catch (e) {
        if (e.name !== 'AbortError') alert('공유에 실패했어요.');
      }
      return;
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: '공구·자재 대여 기록', text });
      } catch (e) {
        if (e.name !== 'AbortError') alert('공유에 실패했어요.');
      }
      return;
    }
    alert('이 브라우저는 공유하기를 지원하지 않아요.');
  }

  // 실시간 리스너 (로그인 게이트 통과 후에만 시작)
  function initRentalApp() {
    col.orderBy('ts', 'desc').onSnapshot(snapshot => {
      records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    }, () => {
      document.getElementById('record-list').innerHTML =
        '<div class="empty-state"><span class="empty-icon">⚠️</span>연결 오류. 새로고침 해주세요.</div>';
    });
  }
</script>
<script src="/tools/assets/presence.js?v=3"></script>

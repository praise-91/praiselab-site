<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피더 커뮤니티</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --bg: #F4F3F0;
    --card-bg: #FFFFFF;
    --border: #ECEBE7;
    --text: #1C1E27;
    --text-dim: #767A85;
    --give-bg: #E5F5EC;
    --give-text: #1E8E56;
    --muted-bg: #F1F0EC;
    --muted-text: #8B8F9C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(244, 243, 240, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }
  .brand span { color: var(--orange); }

  .hamburger-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 사이드 메뉴 ── */
  .menu-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(28,30,39,0.35);
    justify-content: flex-end;
  }
  .menu-overlay.show { display: flex; }
  .menu-sheet {
    width: 78%; max-width: 300px; height: 100%;
    background: var(--card-bg);
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column;
    animation: menuSlideIn 0.22s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes menuSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .menu-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .menu-title { font-size: 15px; font-weight: 900; color: var(--text-dim); letter-spacing: 0.5px; }
  .menu-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  .menu-close:hover { color: var(--orange); }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-radius: 12px;
    background: none; border: none;
    color: var(--text); font-family: inherit;
    font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; width: 100%;
  }
  .menu-item:hover { background: var(--bg); }
  .menu-item-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-item--logout { margin-top: auto; color: #D3453F; }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
  .loading-brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

  .page-head { text-align: center; padding: 20px 0 20px; }
  .page-head h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .locked-link {
    display: block;
    text-align: center;
    color: var(--orange);
    font-weight: 700;
    text-decoration: none;
  }

  .notice-strip {
    background: var(--give-bg);
    color: var(--give-text);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .tab {
    font-size: 14px;
    font-weight: 700;
    color: #9A9DA8;
    padding-bottom: 12px;
    border-bottom: 2px solid transparent;
    background: none;
    border-left: none; border-right: none; border-top: none;
    font-family: inherit;
    cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--orange); }

  .board-panel { display: none; }
  .board-panel.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.5; }

  /* ── 글쓰기 토글 버튼 ── */
  .new-btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .new-btn:hover { background: var(--orange-dark); }

  /* ── 입력 폼 ── */
  .form-card { margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 12px 14px;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1 1 0; min-width: 0; }

  .check-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim); font-weight: 500;
    cursor: pointer;
  }
  .check-row input { width: auto; }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; }
  .form-actions .submit-btn { flex: 1; }
  .cancel-btn {
    padding: 13px 18px;
    background: #FFFFFF;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--orange);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--orange-dark); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 목록 ── */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .job-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .job-card.is-closed { opacity: 0.55; }
  .job-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .job-site { font-size: 14px; font-weight: 700; }
  .job-region { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .badge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .badge.stay-yes { background: var(--give-bg); color: var(--give-text); }
  .badge.stay-no { background: var(--muted-bg); color: var(--muted-text); }
  .badge.stay-negotiable { background: rgba(255,107,43,0.1); color: var(--orange-dark); }
  .badge.closed { background: var(--muted-bg); color: var(--muted-text); }

  .job-meta { font-size: 12px; color: var(--text-dim); line-height: 1.9; }
  .job-meta b { color: var(--text); font-weight: 700; }
  .job-desc { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; }

  .job-card-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--muted-bg);
  }
  .job-wage { font-size: 14px; font-weight: 700; color: var(--orange); }
  .job-contact { font-size: 12px; color: var(--text-dim); }

  .admin-actions { display: flex; gap: 6px; margin-top: 10px; }
  .mini-btn {
    flex: 1; padding: 8px; font-size: 12px; font-weight: 700;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--border); background: #fff; color: var(--text-dim);
  }
  .mini-btn:hover { border-color: var(--orange); color: var(--orange); }
  .mini-btn.danger:hover { border-color: #E24B4A; color: #E24B4A; }

  .post-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .post-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .post-cat { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--muted-bg); color: var(--muted-text); }
  .post-title { font-size: 14px; font-weight: 700; margin: 6px 0 4px; }
  .post-content { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .post-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
  .post-del { font-size: 11.5px; color: var(--text-dim); background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
  .post-del:hover { color: #E24B4A; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">Fee<span>der</span> · 커뮤니티</a>
  <button class="hamburger-btn" id="hamburger-btn" onclick="openMenu()" style="display:none;" aria-label="메뉴">☰</button>
</header>

<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()">
  <div class="menu-sheet" onclick="event.stopPropagation()">
    <div class="menu-head">
      <span class="menu-title">메뉴</span>
      <button class="menu-close" onclick="closeMenu()" aria-label="닫기">✕</button>
    </div>
    <button class="menu-item" id="menu-admin" onclick="closeMenu(); location.href='index.html?admin=1';" style="display:none;">
      <span class="menu-item-icon">🔑</span><span>관리자 기능</span>
    </button>
    <button class="menu-item" onclick="closeMenu(); alert('⚙️ 설정 기능은 준비 중이에요');">
      <span class="menu-item-icon">⚙️</span><span>설정</span>
    </button>
    <button class="menu-item menu-item--logout" onclick="closeMenu(); logout();">
      <span class="menu-item-icon">🚪</span><span>로그아웃</span>
    </button>
  </div>
</div>

<div class="container">

  <!-- 로그인 상태 확인 중 -->
  <div class="view active" id="view-checking">
    <div class="loading-brand">
      <div class="loading-brand-title">Feeder</div>
      <div class="loading-brand-sub">불러오는 중…</div>
    </div>
  </div>

  <!-- 로그인 필요 -->
  <div class="view" id="view-locked">
    <header class="page-head">
      <h1>로그인이 필요해요</h1>
      <div class="page-sub">피더 홈에서 로그인 후 다시 들어와주세요</div>
    </header>
    <div class="card">
      <a href="index.html" class="locked-link">피더 홈으로 →</a>
    </div>
  </div>

  <!-- 커뮤니티 -->
  <div class="view" id="view-app">
    <header class="page-head">
      <h1>피더 커뮤니티</h1>
      <div class="page-sub">현장 소식 · 정보를 나누는 공간</div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tab-jobs" onclick="switchTab('jobs')">구인</button>
      <button class="tab" id="tab-free" onclick="switchTab('free')">자유게시판</button>
    </div>

    <!-- 구인 게시판 -->
    <div class="board-panel active" id="panel-jobs">
      <button class="new-btn" id="job-new-btn" style="display:none;" onclick="openJobForm()">+ 구인 등록</button>

      <div class="card form-card" id="job-form" style="display:none;">
        <div class="field">
          <label>현장명</label>
          <input type="text" id="job-site" placeholder="예: 김포 물류센터 신축" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>시/도</label>
            <select id="job-sido"></select>
          </div>
          <div class="field">
            <label>시/군/구</label>
            <input type="text" id="job-sigungu" placeholder="예: 김포시" />
          </div>
        </div>
        <div class="field">
          <label>공종</label>
          <select id="job-worktype">
            <option value="전기(내선)">전기(내선)</option>
            <option value="전기(플랜트·고압)">전기(플랜트·고압)</option>
            <option value="통신">통신</option>
            <option value="소방">소방</option>
            <option value="설비">설비</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="field">
          <label>모집인원</label>
          <input type="number" id="job-headcount" min="1" placeholder="숫자만 입력" />
        </div>
        <div class="field">
          <label>공사기간</label>
          <label class="check-row" style="margin-bottom:8px;">
            <input type="checkbox" id="job-period-negotiable" onchange="togglePeriodInputs()" /> 협의
          </label>
          <div class="field-row" id="job-period-dates">
            <input type="date" id="job-period-start" />
            <input type="date" id="job-period-end" />
          </div>
        </div>
        <div class="field">
          <label>숙소 제공 여부</label>
          <select id="job-stay" onchange="toggleStayDetail()">
            <option value="yes">제공</option>
            <option value="no">미제공</option>
            <option value="negotiable">협의</option>
          </select>
        </div>
        <div id="job-stay-detail">
          <div class="field">
            <label>숙소 형태</label>
            <input type="text" id="job-stay-type" placeholder="예: 원룸, 2인1실" />
          </div>
          <div class="field">
            <label>숙식비</label>
            <select id="job-meal-cost">
              <option value="free">무료</option>
              <option value="partial">일부 부담</option>
              <option value="cash">현금 지급</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>일당 / 단가</label>
          <label class="check-row" style="margin-bottom:8px;">
            <input type="checkbox" id="job-wage-negotiable" onchange="toggleWageInput()" /> 협의
          </label>
          <input type="number" id="job-wage" placeholder="숫자만 입력 (원)" />
        </div>
        <div class="field">
          <label>세부작업 내용</label>
          <textarea id="job-desc" placeholder="작업 내용을 적어주세요"></textarea>
        </div>
        <div class="field">
          <label>연락방법</label>
          <select id="job-contact-method" style="margin-bottom:8px;">
            <option value="phone">전화번호</option>
            <option value="kakao">카톡 오픈채팅 링크</option>
          </select>
          <input type="text" id="job-contact-value" placeholder="연락처를 입력해주세요" />
        </div>
        <div class="form-actions">
          <button class="cancel-btn" onclick="closeJobForm()">취소</button>
          <button class="submit-btn" id="job-save-btn" onclick="saveJob()">등록하기</button>
        </div>
      </div>

      <div class="list" id="job-list"></div>
    </div>

    <!-- 자유게시판 -->
    <div class="board-panel" id="panel-free">
      <button class="new-btn" id="post-new-btn" onclick="openPostForm()">+ 글쓰기</button>

      <div class="card form-card" id="post-form" style="display:none;">
        <div class="field">
          <label>제목</label>
          <input type="text" id="post-title" placeholder="제목을 입력해주세요" />
        </div>
        <div class="field">
          <label>카테고리</label>
          <select id="post-category">
            <option value="현장후기">현장후기</option>
            <option value="정보·꿀팁">정보·꿀팁</option>
            <option value="질문">질문</option>
            <option value="자유">자유</option>
          </select>
        </div>
        <div class="field">
          <label>내용</label>
          <textarea id="post-content" placeholder="내용을 입력해주세요" style="min-height:120px;"></textarea>
        </div>
        <div class="form-actions">
          <button class="cancel-btn" onclick="closePostForm()">취소</button>
          <button class="submit-btn" id="post-save-btn" onclick="savePost()">등록하기</button>
        </div>
      </div>

      <div class="list" id="post-list"></div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  const auth = firebase.auth();

    '대전광역시', '울산광역시', '세종특별자치시', '경기도', '강원특별자치도',
    '충청북도', '충청남도', '전북특별자치도', '전라남도', '경상북도',

  const MEAL_LABEL = { free: '숙식비 무료', partial: '숙식비 일부 부담', cash: '숙식비 현금 지급' };

  let gateProfileUnsub = null;

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function go(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function switchTab(name) {
    document.getElementById('tab-jobs').classList.toggle('active', name === 'jobs');
    document.getElementById('tab-free').classList.toggle('active', name === 'free');
    document.getElementById('panel-jobs').classList.toggle('active', name === 'jobs');
    document.getElementById('panel-free').classList.toggle('active', name === 'free');
  }

  function logout() {
    auth.signOut().then(() => { location.href = 'index.html'; });
  }
  function openMenu() { document.getElementById('menu-overlay').classList.add('show'); }
  function closeMenu() { document.getElementById('menu-overlay').classList.remove('show'); }

  function formatDate(ts) {
    if (!ts) return '';
    const d = ts.toDate();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${mm}/${dd}`;
  }

  // ══════════════ 구인 게시판 ══════════════

  function initSidoSelect() {
    const sel = document.getElementById('job-sido');
    sel.innerHTML = SIDO_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  function togglePeriodInputs() {
    const negotiable = document.getElementById('job-period-negotiable').checked;
    document.getElementById('job-period-dates').style.display = negotiable ? 'none' : 'flex';
  }

  function toggleStayDetail() {
    const stay = document.getElementById('job-stay').value;
    document.getElementById('job-stay-detail').style.display = stay === 'yes' ? 'block' : 'none';
  }

  function toggleWageInput() {
    const negotiable = document.getElementById('job-wage-negotiable').checked;
    document.getElementById('job-wage').style.display = negotiable ? 'none' : 'block';
  }

  function resetJobForm() {
    document.getElementById('job-site').value = '';
    document.getElementById('job-sigungu').value = '';
    document.getElementById('job-headcount').value = '';
    document.getElementById('job-period-negotiable').checked = false;
    document.getElementById('job-period-start').value = '';
    document.getElementById('job-period-end').value = '';
    document.getElementById('job-stay').value = 'yes';
    document.getElementById('job-stay-type').value = '';
    document.getElementById('job-wage-negotiable').checked = false;
    document.getElementById('job-wage').value = '';
    document.getElementById('job-desc').value = '';
    document.getElementById('job-contact-value').value = '';
    togglePeriodInputs();
    toggleStayDetail();
    toggleWageInput();
  }

  function openJobForm() {
    resetJobForm();
    document.getElementById('job-form').style.display = 'block';
    document.getElementById('job-new-btn').style.display = 'none';
  }

  function closeJobForm() {
    document.getElementById('job-form').style.display = 'none';
    document.getElementById('job-new-btn').style.display = myIsAdmin ? 'block' : 'none';
  }

  function saveJob() {
    const siteName = document.getElementById('job-site').value.trim();
    const sigungu = document.getElementById('job-sigungu').value.trim();
    const headcount = parseInt(document.getElementById('job-headcount').value, 10);
    const description = document.getElementById('job-desc').value.trim();
    const contactValue = document.getElementById('job-contact-value').value.trim();

    if (!siteName) { alert('현장명을 입력해주세요!'); return; }
    if (!sigungu) { alert('시/군/구를 입력해주세요!'); return; }
    if (!headcount || headcount < 1) { alert('모집인원을 입력해주세요!'); return; }
    if (!description) { alert('세부작업 내용을 입력해주세요!'); return; }
    if (!contactValue) { alert('연락처를 입력해주세요!'); return; }

    const periodNegotiable = document.getElementById('job-period-negotiable').checked;
    const wageNegotiable = document.getElementById('job-wage-negotiable').checked;
    const stay = document.getElementById('job-stay').value;

    const doc = {
      siteName,
      regionSido: document.getElementById('job-sido').value,
      regionSigungu: sigungu,
      workType: document.getElementById('job-worktype').value,
      headcount,
      periodType: periodNegotiable ? 'negotiable' : 'dates',
      periodStart: periodNegotiable ? null : (document.getElementById('job-period-start').value || null),
      periodEnd: periodNegotiable ? null : (document.getElementById('job-period-end').value || null),
      stay,
      stayType: stay === 'yes' ? document.getElementById('job-stay-type').value.trim() : '',
      mealCost: stay === 'yes' ? document.getElementById('job-meal-cost').value : '',
      wageNegotiable,
      wage: wageNegotiable ? null : (parseInt(document.getElementById('job-wage').value, 10) || null),
      description,
      contactMethod: document.getElementById('job-contact-method').value,
      contactValue,
      status: 'open',
      authorUid: myUid,
      authorName: myName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    const btn = document.getElementById('job-save-btn');
    btn.disabled = true;
    colJobs.add(doc)
      .then(() => { closeJobForm(); })
      .catch(() => alert('등록 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function toggleJobStatus(id, current) {
    const next = current === 'open' ? 'closed' : 'open';
    colJobs.doc(id).update({ status: next })
      .catch(() => alert('처리 실패. 다시 시도해주세요.'));
  }

  function deleteJob(id) {
    if (!confirm('이 구인글을 삭제할까요?')) return;
    colJobs.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function renderJobs() {
    const list = document.getElementById('job-list');
    if (!jobs.length) {
      list.innerHTML = '<div class="card"><div class="empty-state"><span class="empty-icon">🧑‍🔧</span>아직 등록된 구인 글이 없어요</div></div>';
      return;
    }
    list.innerHTML = jobs.map(j => {
      const stayBadge = `<span class="badge stay-${j.stay}">${STAY_LABEL[j.stay] || ''}</span>`;
      const closedBadge = j.status === 'closed' ? '<span class="badge closed">마감</span>' : '';
      const period = j.periodType === 'negotiable'
        ? '협의'
        : `${j.periodStart || '미정'} ~ ${j.periodEnd || '미정'}`;
      const wage = j.wageNegotiable ? '협의' : (j.wage ? `${j.wage.toLocaleString()}원` : '협의');
      const stayDetail = j.stay === 'yes' && (j.stayType || j.mealCost)
        ? `<div class="job-meta">${escapeHtml(j.stayType || '')}${j.stayType && j.mealCost ? ' · ' : ''}${MEAL_LABEL[j.mealCost] || ''}</div>`
        : '';
      const contactLabel = j.contactMethod === 'kakao' ? '카톡' : '전화';
      const adminActions = myIsAdmin ? `
        <div class="admin-actions">
          <button class="mini-btn" onclick="toggleJobStatus('${j.id}','${j.status}')">${j.status === 'open' ? '마감 처리' : '모집 재개'}</button>
          <button class="mini-btn danger" onclick="deleteJob('${j.id}')">삭제</button>
        </div>` : '';
      return `
        <div class="job-card ${j.status === 'closed' ? 'is-closed' : ''}">
          <div class="job-card-top">
            <div>
              <div class="job-site">${escapeHtml(j.siteName)}</div>
              <div class="job-region">${escapeHtml(j.regionSido)} ${escapeHtml(j.regionSigungu)} · ${escapeHtml(j.workType)}</div>
            </div>
            <div style="display:flex;gap:4px;">${closedBadge}${stayBadge}</div>
          </div>
          <div class="job-meta">모집 <b>${j.headcount}명</b> · 기간 <b>${escapeHtml(period)}</b></div>
          ${stayDetail}
          <div class="job-desc">${escapeHtml(j.description)}</div>
          <div class="job-card-foot">
            <span class="job-wage">${escapeHtml(wage)}</span>
            <span class="job-contact">${contactLabel} · ${escapeHtml(j.contactValue)}</span>
          </div>
          ${adminActions}
        </div>`;
    }).join('');
  }

  function startJobsFeed() {
    if (jobsUnsub) return;
    jobsUnsub = colJobs.orderBy('createdAt', 'desc').onSnapshot(snap => {
      jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderJobs();
    }, () => {
      document.getElementById('job-list').innerHTML = '<div class="card"><div class="empty-state">⚠️ 연결 오류. 새로고침 해주세요.</div></div>';
    });
  }

  // ══════════════ 자유게시판 ══════════════

  function resetPostForm() {
    document.getElementById('post-title').value = '';
    document.getElementById('post-category').value = '현장후기';
    document.getElementById('post-content').value = '';
  }

  function openPostForm() {
    resetPostForm();
    document.getElementById('post-form').style.display = 'block';
    document.getElementById('post-new-btn').style.display = 'none';
  }

  function closePostForm() {
    document.getElementById('post-form').style.display = 'none';
    document.getElementById('post-new-btn').style.display = 'block';
  }

  function savePost() {
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    if (!title) { alert('제목을 입력해주세요!'); return; }
    if (!content) { alert('내용을 입력해주세요!'); return; }

    const doc = {
      title,
      category: document.getElementById('post-category').value,
      content,
      authorUid: myUid,
      authorName: myName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    const btn = document.getElementById('post-save-btn');
    btn.disabled = true;
    colPosts.add(doc)
      .then(() => { closePostForm(); })
      .catch(() => alert('등록 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function deletePost(id) {
    if (!confirm('이 글을 삭제할까요?')) return;
    colPosts.doc(id).delete()
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function renderPosts() {
    const list = document.getElementById('post-list');
    if (!posts.length) {
      list.innerHTML = '<div class="card"><div class="empty-state"><span class="empty-icon">💬</span>아직 게시물이 없어요</div></div>';
      return;
    }
    list.innerHTML = posts.map(p => {
      const canDelete = myIsAdmin || p.authorUid === myUid;
      return `
        <div class="post-card">
          <div class="post-card-top">
            <span class="post-cat">${escapeHtml(p.category)}</span>
            ${canDelete ? `<button class="post-del" onclick="deletePost('${p.id}')">삭제</button>` : ''}
          </div>
          <div class="post-title">${escapeHtml(p.title)}</div>
          <div class="post-content">${escapeHtml(p.content)}</div>
          <div class="post-meta">${escapeHtml(p.authorName)} · ${formatDate(p.createdAt)}</div>
        </div>`;
    }).join('');
  }

  function startPostsFeed() {
    if (postsUnsub) return;
    postsUnsub = colPosts.orderBy('createdAt', 'desc').onSnapshot(snap => {
      posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPosts();
    }, () => {
      document.getElementById('post-list').innerHTML = '<div class="card"><div class="empty-state">⚠️ 연결 오류. 새로고침 해주세요.</div></div>';
    });
  }

  // ══════════════ 로그인 게이트 ══════════════

  initSidoSelect();
  togglePeriodInputs();
  toggleStayDetail();
  toggleWageInput();

  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }

    if (!user) {
      myUid = null;
      document.getElementById('hamburger-btn').style.display = 'none';
      closeMenu();
      go('view-locked');
      return;
    }

    gateProfileUnsub = colToolsUsers.doc(user.uid).onSnapshot(doc => {
      if (!doc.exists || doc.data().status !== 'approved') {
        myUid = null;
        document.getElementById('hamburger-btn').style.display = 'none';
        closeMenu();
        go('view-locked');
        return;
      }
      const profile = doc.data();
      myUid = user.uid;
      myName = profile.name;
      myIsAdmin = !!profile.isAdmin;

      document.getElementById('hamburger-btn').style.display = '';
      document.getElementById('menu-admin').style.display = myIsAdmin ? '' : 'none';

      document.getElementById('job-new-btn').style.display = myIsAdmin ? 'block' : 'none';

      startJobsFeed();
      startPostsFeed();
      go('view-app');
    });
  });
</script>
</body>
</html>

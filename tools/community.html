<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피더 커뮤니티</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --bg: #F4F3F0;
    --card-bg: #FFFFFF;
    --border: #ECEBE7;
    --text: #1C1E27;
    --text-dim: #767A85;
    --give-bg: #E5F5EC;
    --give-text: #1E8E56;
    --muted-bg: #F1F0EC;
    --muted-text: #8B8F9C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(244, 243, 240, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }
  .brand span { color: var(--orange); }

  .hamburger-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ── 사이드 메뉴 ── */
  .menu-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(28,30,39,0.35);
    justify-content: flex-end;
  }
  .menu-overlay.show { display: flex; }
  .menu-sheet {
    width: 78%; max-width: 300px; height: 100%;
    background: var(--card-bg);
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column;
    animation: menuSlideIn 0.22s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes menuSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .menu-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .menu-title { font-size: 15px; font-weight: 900; color: var(--text-dim); letter-spacing: 0.5px; }
  .menu-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  .menu-close:hover { color: var(--orange); }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-radius: 12px;
    background: none; border: none;
    color: var(--text); font-family: inherit;
    font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; width: 100%;
  }
  .menu-item:hover { background: var(--bg); }
  .menu-item-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-item--logout { margin-top: auto; color: #D3453F; }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
  .loading-brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

  .page-head { text-align: center; padding: 20px 0 20px; }
  .page-head h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .notice-strip {
    background: var(--give-bg);
    color: var(--give-text);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    padding-top: 4px;
  }
  .tab {
    font-size: 14px;
    font-weight: 700;
    color: #9A9DA8;
    padding-bottom: 12px;
    border-bottom: 2px solid transparent;
    background: none;
    border-left: none; border-right: none; border-top: none;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--orange); }

  .search-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-input {
    flex: 1; min-width: 0;
    padding: 9px 12px;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    -webkit-appearance: none;
  }
  .search-input:focus { border-color: var(--orange); }
  .filter-btn {
    flex-shrink: 0;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .filter-btn.active { border-color: var(--orange); background: rgba(255,107,43,0.08); }

  .filter-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .filter-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-group select {
    flex: 1 1 calc(50% - 4px);
    min-width: 100px;
    padding: 8px 10px;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    -webkit-appearance: none;
  }
  .filter-group select:focus { border-color: var(--orange); }
  .filter-range {
    flex: 1 1 100%;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-range input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    -webkit-appearance: none;
  }
  .filter-range input:focus { border-color: var(--orange); }
  .filter-range span { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
  .filter-reset-btn {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12.5px; font-weight: 700;
    cursor: pointer;
  }
  .filter-reset-btn:hover { border-color: var(--orange); color: var(--orange); }

  .board-panel { display: none; }
  .board-panel.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.5; }

  /* ── 글쓰기 토글 버튼 ── */
  .new-btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .new-btn:hover { background: var(--orange-dark); }

  /* ── 입력 폼 ── */
  .form-card { margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 12px 14px;
    background: #FAFAF8;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1 1 0; min-width: 0; }

  .check-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim); font-weight: 500;
    cursor: pointer;
  }
  .check-row input { width: auto; }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; }
  .form-actions .submit-btn { flex: 1; }
  .cancel-btn {
    padding: 13px 18px;
    background: #FFFFFF;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--orange);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--orange-dark); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 목록 ── */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .job-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .job-card.is-closed { opacity: 0.55; }
  .job-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .job-site { font-size: 14px; font-weight: 700; }
  .job-region { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .badge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .badge.stay-yes { background: var(--give-bg); color: var(--give-text); }
  .badge.stay-no { background: var(--muted-bg); color: var(--muted-text); }
  .badge.stay-negotiable { background: rgba(255,107,43,0.1); color: var(--orange-dark); }
  .badge.closed { background: var(--muted-bg); color: var(--muted-text); }

  .job-meta { font-size: 12px; color: var(--text-dim); line-height: 1.9; }
  .job-meta b { color: var(--text); font-weight: 700; }
  .job-desc { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; }

  .job-card-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--muted-bg);
  }
  .job-wage { font-size: 14px; font-weight: 700; color: var(--orange); }
  .job-contact { font-size: 12px; color: var(--text-dim); }
  .card-counts { font-size: 11.5px; color: var(--text-dim); }

  .admin-actions { display: flex; gap: 6px; margin-top: 10px; }
  .mini-btn {
    flex: 1; padding: 8px; font-size: 12px; font-weight: 700;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--border); background: #fff; color: var(--text-dim);
  }
  .mini-btn:hover { border-color: var(--orange); color: var(--orange); }
  .mini-btn.danger:hover { border-color: #E24B4A; color: #E24B4A; }

  .post-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .post-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .post-cat { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--muted-bg); color: var(--muted-text); }
  .post-title { font-size: 14px; font-weight: 700; margin: 6px 0 4px; }
  .post-content { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .post-content a, .job-desc a { color: var(--orange); text-decoration: underline; word-break: break-all; }
  .post-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
  .post-del { font-size: 11.5px; color: var(--text-dim); background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
  .post-del:hover { color: #E24B4A; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">Fee<span>der</span> · 커뮤니티</a>
  <button class="hamburger-btn" id="hamburger-btn" onclick="openMenu()" aria-label="메뉴">☰</button>
</header>

<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()">
  <div class="menu-sheet" onclick="event.stopPropagation()">
    <div class="menu-head">
      <span class="menu-title">메뉴</span>
      <button class="menu-close" onclick="closeMenu()" aria-label="닫기">✕</button>
    </div>
    <button class="menu-item" id="menu-user" onclick="closeMenu(); location.href='index.html?profile=1';" style="display:none;">
      <span class="menu-item-icon">👤</span><span id="menu-user-name"></span>
    </button>
    <button class="menu-item" id="menu-guest" onclick="closeMenu(); location.href='index.html';" style="display:none;">
      <span class="menu-item-icon">🔑</span><span>로그인 / 회원가입</span>
    </button>
    <button class="menu-item" id="menu-admin" onclick="closeMenu(); location.href='index.html?admin=1';" style="display:none;">
      <span class="menu-item-icon">🔑</span><span>팀장 기능</span>
    </button>
    <button class="menu-item menu-item--logout" id="menu-logout" onclick="closeMenu(); logout();" style="display:none;">
      <span class="menu-item-icon">🚪</span><span>로그아웃</span>
    </button>
  </div>
</div>

<div class="container">

  <!-- 로그인 상태 확인 중 -->
  <div class="view active" id="view-checking">
    <div class="loading-brand">
      <div class="loading-brand-title">Feeder</div>
      <div class="loading-brand-sub">불러오는 중…</div>
    </div>
  </div>

  <!-- 커뮤니티 -->
  <div class="view" id="view-app">
    <div class="tabs">
      <button class="tab active" id="tab-jobs" onclick="switchTab('jobs')">구인</button>
      <button class="tab" id="tab-seekers" onclick="switchTab('seekers')">구직</button>
      <button class="tab" id="tab-free" onclick="switchTab('free')">자유게시판</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="검색" oninput="onSearchInput()" />
      <button class="filter-btn" id="filter-toggle-btn" onclick="toggleFilterPanel()" aria-label="필터">🎚️</button>
    </div>

    <div class="filter-panel" id="filter-panel" style="display:none;">
      <div class="filter-group" id="filter-jobs">
        <select id="filter-job-worktype" onchange="onJobFilterChange()">
          <option value="">공종 전체</option>
          <option value="전기(내선)">전기(내선)</option>
          <option value="전기(플랜트·고압)">전기(플랜트·고압)</option>
          <option value="통신">통신</option>
          <option value="소방">소방</option>
          <option value="설비">설비</option>
          <option value="기타">기타</option>
        </select>
        <select id="filter-job-sido" onchange="onJobFilterChange()">
          <option value="">지역 전체</option>
        </select>
        <select id="filter-job-stay" onchange="onJobFilterChange()">
          <option value="">숙소 전체</option>
          <option value="yes">숙소제공</option>
          <option value="no">숙소미제공</option>
          <option value="negotiable">숙소협의</option>
        </select>
        <select id="filter-job-status" onchange="onJobFilterChange()">
          <option value="">상태 전체</option>
          <option value="open">모집중</option>
          <option value="closed">마감</option>
        </select>
        <div class="filter-range">
          <input type="number" id="filter-job-wage-min" placeholder="최소 단가" oninput="onJobFilterChange()" />
        </div>
      </div>
      <div class="filter-group" id="filter-seekers" style="display:none;">
        <select id="filter-seeker-worktype" onchange="onSeekerFilterChange()">
          <option value="">공종 전체</option>
          <option value="전기(내선)">전기(내선)</option>
          <option value="전기(플랜트·고압)">전기(플랜트·고압)</option>
          <option value="통신">통신</option>
          <option value="소방">소방</option>
          <option value="설비">설비</option>
          <option value="기타">기타</option>
        </select>
        <select id="filter-seeker-region" onchange="onSeekerFilterChange()">
          <option value="">지역 전체</option>
        </select>
        <select id="filter-seeker-stay" onchange="onSeekerFilterChange()">
          <option value="">숙소 전체</option>
          <option value="needed">숙소필요</option>
          <option value="not_needed">숙소불필요</option>
          <option value="negotiable">숙소협의</option>
        </select>
        <select id="filter-seeker-status" onchange="onSeekerFilterChange()">
          <option value="">상태 전체</option>
          <option value="available">구직중</option>
          <option value="matched">완료</option>
        </select>
      </div>
      <div class="filter-group" id="filter-free" style="display:none;">
        <select id="filter-post-category" onchange="onPostFilterChange()">
          <option value="">카테고리 전체</option>
          <option value="현장후기">현장후기</option>
          <option value="정보·꿀팁">정보·꿀팁</option>
          <option value="질문">질문</option>
          <option value="자유">자유</option>
        </select>
      </div>
      <button class="filter-reset-btn" onclick="resetFilters()">필터 초기화</button>
    </div>

    <div id="list-area">
    <!-- 구인 게시판 -->
    <div class="board-panel active" id="panel-jobs">
      <button class="new-btn" id="job-new-btn" style="display:none;" onclick="openJobForm()">+ 구인 등록</button>

      <div class="card form-card" id="job-form" style="display:none;">
        <div class="field">
          <label>제목</label>
          <input type="text" id="job-title" placeholder="예: 전기 기능공 급구" />
        </div>
        <div class="field">
          <label>현장명</label>
          <input type="text" id="job-site" placeholder="예: 김포 물류센터 신축" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>시/도</label>
            <select id="job-sido"></select>
          </div>
          <div class="field">
            <label>시/군/구</label>
            <input type="text" id="job-sigungu" placeholder="예: 김포시" />
          </div>
        </div>
        <div class="field">
          <label>공종</label>
          <select id="job-worktype">
            <option value="전기(내선)">전기(내선)</option>
            <option value="전기(플랜트·고압)">전기(플랜트·고압)</option>
            <option value="통신">통신</option>
            <option value="소방">소방</option>
            <option value="설비">설비</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="field">
          <label>모집인원</label>
          <input type="number" id="job-headcount" min="1" placeholder="숫자만 입력" />
        </div>
        <div class="field">
          <label>공사기간</label>
          <label class="check-row" style="margin-bottom:8px;">
            <input type="checkbox" id="job-period-negotiable" onchange="togglePeriodInputs()" /> 협의
          </label>
          <div class="field-row" id="job-period-dates">
            <input type="date" id="job-period-start" />
            <input type="date" id="job-period-end" />
          </div>
        </div>
        <div class="field">
          <label>숙소 제공 여부</label>
          <select id="job-stay" onchange="toggleStayDetail()">
            <option value="yes">제공</option>
            <option value="no">미제공</option>
            <option value="negotiable">협의</option>
          </select>
        </div>
        <div id="job-stay-detail">

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // escapeHtml로 이스케이프된 텍스트를 받아 http(s):// 링크만 <a>로 감싼다.
  // (javascript: 같은 위험한 스킴은 애초에 매칭 안 됨)
  function linkify(escapedText) {
    return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url => {
      let trail = '';
      const m = url.match(/[.,!?)\]]+$/);
      if (m) { trail = m[0]; url = url.slice(0, url.length - trail.length); }
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trail}`;
    });
  }

  function matchesJobFilter(j) {
    if (jobFilter.workType && j.workType !== jobFilter.workType) return false;
    if (jobFilter.sido && j.regionSido !== jobFilter.sido) return false;
    if (jobFilter.stay && j.stay !== jobFilter.stay) return false;
    if (jobFilter.status && j.status !== jobFilter.status) return false;
    if (jobFilter.wageMin != null) {
      if (j.wageNegotiable || j.wage == null) return false;
      if (j.wage < jobFilter.wageMin) return false;
    }
    return true;
  }

    if (seekerFilter.status && s.status !== seekerFilter.status) return false;
    return true;
  }

  function formatDate(ts) {
    if (!ts) return '';
    const d = ts.toDate();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return `${mm}/${dd} ${hh}:${mi}`;
  }

  function saveJob() {
    const title = document.getElementById('job-title').value.trim();
    const siteName = document.getElementById('job-site').value.trim();
    const sigungu = document.getElementById('job-sigungu').value.trim();
    const headcount = parseInt(document.getElementById('job-headcount').value, 10);
    const description = document.getElementById('job-desc').value.trim();
    const contactValue = document.getElementById('job-contact-value').value.trim();

    if (!title) { alert('제목을 입력해주세요!'); return; }
    if (!siteName) { alert('현장명을 입력해주세요!'); return; }
    if (!sigungu) { alert('시/군/구를 입력해주세요!'); return; }
    if (!headcount || headcount < 1) { alert('모집인원을 입력해주세요!'); return; }
    if (!description) { alert('세부작업 내용을 입력해주세요!'); return; }
    if (!contactValue) { alert('연락처를 입력해주세요!'); return; }

    const periodNegotiable = document.getElementById('job-period-negotiable').checked;
    const wageNegotiable = document.getElementById('job-wage-negotiable').checked;
    const stay = document.getElementById('job-stay').value;

    const fields = {
      title,
      siteName,
      regionSido: document.getElementById('job-sido').value,
      regionSigungu: sigungu,
      workType: document.getElementById('job-worktype').value,
      headcount,
      periodType: periodNegotiable ? 'negotiable' : 'dates',
      periodStart: periodNegotiable ? null : (document.getElementById('job-period-start').value || null),
      periodEnd: periodNegotiable ? null : (document.getElementById('job-period-end').value || null),
      stay,
      stayType: stay === 'yes' ? document.getElementById('job-stay-type').value.trim() : '',
      mealCost: stay === 'yes' ? document.getElementById('job-meal-cost').value : '',
      wageNegotiable,
      wage: wageNegotiable ? null : (parseInt(document.getElementById('job-wage').value, 10) || null),
      description,
      contactMethod: document.getElementById('job-contact-method').value,
      contactValue,
    };

    const btn = document.getElementById('job-save-btn');
    btn.disabled = true;

    if (editingJobId) {
      colJobs.doc(editingJobId).update(fields)
        .then(() => { closeJobForm(); })
        .catch(() => alert('수정 실패. 인터넷 연결을 확인해주세요.'))
        .finally(() => { btn.disabled = false; });
    } else {
      colJobs.add({
        ...fields,
        status: 'open',
        views: 0,
        authorUid: myUid,
        authorName: myName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      })
        .then(() => { closeJobForm(); })
        .catch(() => alert('등록 실패. 인터넷 연결을 확인해주세요.'))
        .finally(() => { btn.disabled = false; });
    }
  }

  function saveSeeker() {
    const title = document.getElementById('seeker-title').value.trim();
    const career = document.getElementById('seeker-career').value.trim();
    const intro = document.getElementById('seeker-intro').value.trim();
    const contactValue = document.getElementById('seeker-contact-value').value.trim();

    if (!title) { alert('제목을 입력해주세요!'); return; }
    if (!career) { alert('경력을 입력해주세요!'); return; }
    if (!intro) { alert('자기소개를 입력해주세요!'); return; }
    if (!contactValue) { alert('연락처를 입력해주세요!'); return; }

    const fields = {
      title,
      workType: document.getElementById('seeker-worktype').value,
      career,
      region: document.getElementById('seeker-region').value,
      stay: document.getElementById('seeker-stay').value,
      intro,
      contactMethod: document.getElementById('seeker-contact-method').value,
      contactValue,

    const btn = document.getElementById('seeker-save-btn');

    if (editingSeekerId) {
      colSeekers.doc(editingSeekerId).update(fields)
        .then(() => { closeSeekerForm(); })
        .catch(() => alert('수정 실패. 인터넷 연결을 확인해주세요.'))
        .finally(() => { btn.disabled = false; });

      colSeekers.add({
        ...fields,
        status: 'available',
        views: 0,
        authorUid: myUid,
        authorName: myName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

        .then(() => { closeSeekerForm(); })

        .finally(() => { btn.disabled = false; });

  function getViewIdentity() {
    if (myUid) return myUid;
    let gid = localStorage.getItem('feederGuestId');
    if (!gid) {
      gid = 'g_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('feederGuestId', gid);
    }
    return gid;
  }

  function incrementViewsOnce(colRef, type, id) {
    const identity = getViewIdentity();
    const viewId = `${type}_${id}_${identity}`;
    colViews.doc(viewId).set({ postId: id, identity })
      .then(() => {
        colRef.doc(id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
      })
      .catch(() => {}); // 이미 조회한 기록이 있으면(또는 실패하면) 카운트하지 않음
  }

      </div>
      <div class="job-meta">경력 <b>${escapeHtml(s.career)}</b> · ${formatDate(s.createdAt)} · 👁 ${s.views || 0}</div>
      <div class="job-desc">${linkify(escapeHtml(s.intro))}</div>
      <div class="job-card-foot">
        <span class="job-contact">${contactLabel} · ${escapeHtml(s.contactValue)}</span>
      </div>
      ${manageActions}
    `;
  }

  function renderComments() {
    const list = document.getElementById('comment-list');
    if (!comments.length) {
      list.innerHTML = '<div class="empty-state" style="padding:16px 0;">아직 댓글이 없어요</div>';
      return;
    }
    list.innerHTML = comments.map(c => {
      const canManage = myIsAdmin || c.authorUid === myUid;
      return `
        <div class="post-card" style="padding:10px 12px;">
          <div class="post-card-top" style="margin-bottom:2px;">
            <span style="font-size:12.5px; font-weight:700;">${escapeHtml(c.authorName)}</span>
            ${canManage ? `<span style="display:flex; gap:8px;">
              <button class="post-del" onclick="editComment('${c.id}')">수정</button>
              <button class="post-del" onclick="deleteComment('${c.id}')">삭제</button>
            </span>` : ''}
          </div>
          <div class="post-content" style="font-size:13px;">${linkify(escapeHtml(c.content))}</div>
          <div class="post-meta">${formatDate(c.createdAt)}</div>
        </div>`;
    }).join('');
  }

  function startCommentsFeed(postId) {
    if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
    comments = [];
    cancelCommentEdit();
    renderComments();
    commentsUnsub = colComments.where('postId', '==', postId).orderBy('createdAt', 'asc').onSnapshot(snap => {
      comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderComments();
    }, () => {
      document.getElementById('comment-list').innerHTML = '<div class="empty-state">⚠️ 연결 오류. 새로고침 해주세요.</div>';
    });
  }

  function addComment() {
    if (!myUid) { alert('로그인 후 댓글을 남길 수 있어요.'); return; }
    if (!currentDetailId) return;
    const input = document.getElementById('comment-input');
    const content = input.value.trim();
    if (!content) { alert('댓글 내용을 입력해주세요!'); return; }

    const btn = document.getElementById('comment-save-btn');
    btn.disabled = true;

    if (editingCommentId) {
      colComments.doc(editingCommentId).update({ content })
        .then(() => { cancelCommentEdit(); })
        .catch(() => alert('댓글 수정 실패. 인터넷 연결을 확인해주세요.'))
        .finally(() => { btn.disabled = false; });
      return;
    }

    colComments.add({
      postId: currentDetailId,
      content,
      authorUid: myUid,
      authorName: myName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
      .then(() => { input.value = ''; })
      .catch(() => alert('댓글 등록 실패. 인터넷 연결을 확인해주세요.'))
      .finally(() => { btn.disabled = false; });
  }

  function editComment(id) {
    const c = comments.find(x => x.id === id);
    if (!c) return;
    editingCommentId = id;
    document.getElementById('comment-input').value = c.content;
    document.getElementById('comment-save-btn').textContent = '댓글 수정';
    document.getElementById('comment-cancel-edit-btn').style.display = 'block';
    document.getElementById('comment-input').focus();
  }

  function cancelCommentEdit() {
    editingCommentId = null;
    document.getElementById('comment-input').value = '';
    document.getElementById('comment-save-btn').textContent = '댓글 등록';
    document.getElementById('comment-cancel-edit-btn').style.display = 'none';
  }

  function deleteComment(id) {
    if (!confirm('이 댓글을 삭제할까요?')) return;
    colComments.doc(id).delete()
      .then(() => { if (editingCommentId === id) cancelCommentEdit(); })
      .catch(() => alert('삭제 실패. 다시 시도해주세요.'));
  }

  function startAllCommentsFeed() {
    if (allCommentsUnsub) return;
    allCommentsUnsub = colComments.onSnapshot(snap => {
      commentCounts = {};
      snap.docs.forEach(d => {
        const postId = d.data().postId;
        commentCounts[postId] = (commentCounts[postId] || 0) + 1;
      });
      renderJobs();
      renderSeekers();
      renderPosts();
    });
  }

  function startPostsFeed() {
    if (postsUnsub) return;
    postsUnsub = colPosts.orderBy('createdAt', 'desc').onSnapshot(snap => {
      posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPosts();
    }, () => {
      document.getElementById('post-list').innerHTML = '<div class="card"><div class="empty-state">⚠️ 연결 오류. 새로고침 해주세요.</div></div>';
    });
  }

  // ══════════════ 로그인 게이트 ══════════════

  initSidoSelect();
  initSeekerRegionSelect();
  togglePeriodInputs();
  toggleStayDetail();
  toggleWageInput();

  function displayName(profile) {
    return profile.nickname || profile.name || profile.username || '이름없음';
  }

  function updateMenuForAuth() {
    document.getElementById('menu-user').style.display = myUid ? '' : 'none';
    document.getElementById('menu-user-name').textContent = myName;
    document.getElementById('menu-guest').style.display = myUid ? 'none' : '';
    document.getElementById('menu-admin').style.display = myIsAdmin ? '' : 'none';
    document.getElementById('menu-logout').style.display = myUid ? '' : 'none';

    document.getElementById('job-new-btn').style.display = myIsAdmin ? 'block' : 'none';
    document.getElementById('seeker-new-btn').style.display = myUid ? 'block' : 'none';
    document.getElementById('post-new-btn').style.display = myUid ? 'block' : 'none';
    document.getElementById('comment-form-member').style.display = myUid ? 'block' : 'none';
    document.getElementById('comment-form-guest').style.display = myUid ? 'none' : 'block';
  }

  function enterAsGuest() {
    myUid = null;
    myName = '';
    myIsAdmin = false;
    updateMenuForAuth();
    startJobsFeed();
    startSeekersFeed();
    startPostsFeed();
    startAllCommentsFeed();
    go('view-app');
  }

  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }

    if (!user) {
      enterAsGuest();
      return;
    }

    gateProfileUnsub = colToolsUsers.doc(user.uid).onSnapshot(doc => {
      if (!doc.exists || doc.data().status !== 'approved') {
        enterAsGuest();
        return;
      }
      const profile = doc.data();
      myUid = user.uid;
      myName = displayName(profile);
      myIsAdmin = !!profile.isAdmin;
      updateMenuForAuth();

      startJobsFeed();
      startSeekersFeed();
      startPostsFeed();
      startAllCommentsFeed();
      go('view-app');
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피더 커뮤니티</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --bg: #F4F3F0;
    --card-bg: #FFFFFF;
    --border: #ECEBE7;
    --text: #1C1E27;
    --text-dim: #767A85;
    --give-bg: #E5F5EC;
    --give-text: #1E8E56;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .container { max-width: 480px; margin: 0 auto; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(244, 243, 240, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }
  .brand span { color: var(--orange); }

  .whoami {
    font-size: 12px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .whoami:hover { border-color: var(--orange); color: var(--orange); }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
  .loading-brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

  .page-head { text-align: center; padding: 20px 0 20px; }
  .page-head h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .locked-link {
    display: block;
    text-align: center;
    color: var(--orange);
    font-weight: 700;
    text-decoration: none;
  }

  .notice-strip {
    background: var(--give-bg);
    color: var(--give-text);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .tab {
    font-size: 14px;
    font-weight: 700;
    color: #9A9DA8;
    padding-bottom: 12px;
    border-bottom: 2px solid transparent;
    background: none;
    border-left: none; border-right: none; border-top: none;
    font-family: inherit;
    cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--orange); }

  .board-panel { display: none; }
  .board-panel.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.5; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">Fee<span>der</span> · 커뮤니티</a>
  <button class="whoami" id="whoami" onclick="logout()" style="display:none;"></button>
</header>

<div class="container">

  <!-- 로그인 상태 확인 중 -->
  <div class="view active" id="view-checking">
    <div class="loading-brand">
      <div class="loading-brand-title">Feeder</div>
      <div class="loading-brand-sub">불러오는 중…</div>
    </div>
  </div>

  <!-- 로그인 필요 -->
  <div class="view" id="view-locked">
    <header class="page-head">
      <h1>로그인이 필요해요</h1>
      <div class="page-sub">피더 홈에서 로그인 후 다시 들어와주세요</div>
    </header>
    <div class="card">
      <a href="index.html" class="locked-link">피더 홈으로 →</a>
    </div>
  </div>

  <!-- 커뮤니티 -->
  <div class="view" id="view-app">
    <header class="page-head">
      <h1>피더 커뮤니티</h1>
      <div class="page-sub">현장 소식 · 정보를 나누는 공간</div>
    </header>

    <div class="notice-strip" id="admin-preview-notice" style="display:none;">
      🚧 관리자 미리보기 — 글쓰기·목록 기능은 다음 단계에서 만들어질 예정이에요
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-jobs" onclick="switchTab('jobs')">구인</button>
      <button class="tab" id="tab-free" onclick="switchTab('free')">자유게시판</button>
    </div>

    <div class="board-panel active" id="panel-jobs">
      <div class="card">
        <div class="empty-state">
          <span class="empty-icon">🧑‍🔧</span>
          아직 등록된 구인 글이 없어요
        </div>
      </div>
    </div>

    <div class="board-panel" id="panel-free">
      <div class="card">
        <div class="empty-state">
          <span class="empty-icon">💬</span>
          아직 게시물이 없어요
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAIPHUtjoIEjVDmgMgXD3-Moq5oz--2_xY",
    authDomain: "healingcamp-51eb0.firebaseapp.com",
    projectId: "healingcamp-51eb0",
  });

  const auth = firebase.auth();
  const db = firebase.firestore();
  const colToolsUsers = db.collection('tools_users');

  let gateProfileUnsub = null;

  function go(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function switchTab(name) {
    document.getElementById('tab-jobs').classList.toggle('active', name === 'jobs');
    document.getElementById('tab-free').classList.toggle('active', name === 'free');
    document.getElementById('panel-jobs').classList.toggle('active', name === 'jobs');
    document.getElementById('panel-free').classList.toggle('active', name === 'free');
  }

  function logout() {
    auth.signOut().then(() => { location.href = 'index.html'; });
  }

  // ── 피더 로그인 게이트 (다른 도구들과 동일 패턴) ──
  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }

    if (!user) {
      go('view-locked');
      return;
    }

    gateProfileUnsub = colToolsUsers.doc(user.uid).onSnapshot(doc => {
      if (!doc.exists || doc.data().status !== 'approved') {
        go('view-locked');
        return;
      }
      const profile = doc.data();
      const whoami = document.getElementById('whoami');
      whoami.style.display = '';
      whoami.textContent = profile.name;
      document.getElementById('admin-preview-notice').style.display = profile.isAdmin ? '' : 'none';
      go('view-app');
    });
  });
</script>
</body>
</html>

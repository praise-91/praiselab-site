  (function () {

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #1A1E2E;
    --steel-mid: #252A3D;
    --steel-light: #2E3450;

    --loss: #FF6B6B;

    --header-bg: rgba(26, 30, 46, 0.8);

  :root[data-theme="light"] {
    --orange: #FF6B2B;
    --orange-dark: #E05520;
    --steel: #F4F3F0;
    --steel-mid: #FFFFFF;
    --steel-light: #F0EFEA;

    --text-dim: #767A85;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    background: var(--steel);

  .container { max-width: 560px; margin: 0 auto; }

  .site-header {
    position: sticky;
    top: 0;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -20px -16px 20px;
  }

  .brand {
    font-size: 15px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px; text-decoration: none;
  }

  .hamburger-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { border-color: var(--orange); color: var(--orange); }

  .menu-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5);
    justify-content: flex-end;
  }
  .menu-overlay.show { display: flex; }
  .menu-sheet {
    width: 78%; max-width: 300px; height: 100%;
    background: var(--steel-mid);
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column;
    animation: menuSlideIn 0.22s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes menuSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .menu-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .menu-title { font-size: 15px; font-weight: 900; color: var(--text-dim); letter-spacing: 0.5px; }
  .menu-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  .menu-close:hover { color: var(--orange); }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-radius: 12px;
    background: none; border: none;
    color: var(--text); font-family: inherit;
    font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; width: 100%;

  .menu-item:hover { background: var(--steel-light); }
  .menu-item-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-item--logout { margin-top: auto; color: #ff8a8a; }

  .site-header-title {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 15px; font-weight: 700; color: var(--text);

  }

  header.page-head { text-align: center; padding: 20px 0 24px; }

  header.page-head .page-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .view { display: none; }
  .view.active { display: block; }

  .locked-wrap { text-align: center; padding: 60px 20px; }
  .locked-wrap .header-icon { font-size: 40px; }

  .locked-wrap a {

  .card {
    background: var(--steel-mid);

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: 12px; font-weight: 700; color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 12px 14px; background: var(--steel-light);
    border: 1.5px solid var(--border); border-radius: 9px; color: var(--text);
    font-family: inherit; font-size: 14.5px; outline: none; -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { border-color: var(--orange); }

  .btn {
    padding: 12px 18px; background: #fff; border: none; border-radius: 10px;
    color: var(--orange); font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .btn:hover { background: rgba(255,107,43,0.08); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.small { padding: 8px 12px; font-size: 12.5px; }

  .preset-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .preset-btn {

  .preset-btn.active { border-color: var(--orange); background: rgba(255,107,43,0.1); color: var(--orange); }

  .empty-state { text-align: center; padding: 30px 16px; color: var(--text-dim); font-size: 13.5px; }
  .empty-icon { font-size: 28px; display: block; margin-bottom: 8px; opacity: 0.5; }

  .loading-brand { text-align: center; padding-top: 140px; }
  .loading-brand-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }

  .tool-badge {

  .approve-row {

  .approve-row:last-child { border-bottom: none; padding-bottom: 0; }
  .approve-name { font-size: 15px; font-weight: 700; }

  table.member-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.member-table th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text-dim);
    padding: 6px 6px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.member-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.member-table tr:last-child td { border-bottom: none; }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: var(--give); color: #0a1a0f; padding: 12px 24px; border-radius: 50px;
    font-size: 14px; font-weight: 700; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap; z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="view" id="view-app">

        <button class="preset-btn" id="inq-filter-closed" onclick="setInquiryFilter('closed')">처리완료</button>

    <!-- 가입자 목록 -->

        <table class="member-table">
          <thead><tr><th>이름</th><th>소속</th><th>등급</th><th>가입일</th></tr></thead>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAIPHUtjoIEjVDmgMgXD3-Moq5oz--2_xY",
    authDomain: "healingcamp-51eb0.firebaseapp.com",
    projectId: "healingcamp-51eb0",
    appId: "1:147368194254:web:bb087f46ff60f4db62e09f",
  });
  // 2026-07-14 App Check 도입: index.html과 동일한 이유(스크립트 기반 도배/가입 공격 방지)
  firebase.appCheck().activate(
    new firebase.appCheck.ReCaptchaV3Provider('6LeODVMtAAAAANkeTWgPXGpHO168GqdwwMFQzh7J'),
    true
  );

  const auth = firebase.auth();
  const db = firebase.firestore();
  const colToolsUsers = db.collection('tools_users');
  const colTeams = db.collection('tools_teams');
  const colPresence = db.collection('tools_presence');
  const colStats = db.collection('tools_stats');
  const colInquiries = db.collection('tools_inquiries');

  function logout() { auth.signOut(); }
  function openMenu() { document.getElementById('menu-overlay').classList.add('show'); }
  function closeMenu() { document.getElementById('menu-overlay').classList.remove('show'); }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || '저장 완료';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function go(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function displayName(u) {
    return (u && (u.nickname || u.name || u.username)) || '이름없음';
  }

  function formatDateShort(ts) {
    if (!ts) return '-';
    const d = ts.toDate();
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  // ══════════════ 가입자 목록 ══════════════
  let users = [];
  let usersUnsub = null;

  function startUsersWatch() {
    if (usersUnsub) return;
    usersUnsub = colToolsUsers.onSnapshot(snap => {
      users = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0));
      document.getElementById('stat-members').textContent = users.length.toLocaleString('ko-KR');
      document.getElementById('user-count').textContent = users.length.toLocaleString('ko-KR');
      renderTeamConversion();
      renderNewSignups();
      renderUserTable();
      renderTeamsList();
    }, () => {});
  }

  // 팀 전환율: 팀에 소속되지 않은 순수 개인회원(teamCode도 없고 팀장도 아님)을 뺀
  // 나머지 비율. 회원가입 후 팀을 찾아 들어갔는지(또는 직접 팀장이 됐는지) 보는 지표
  function renderTeamConversion() {
    const el = document.getElementById('stat-team-conv');
    if (!el || !users.length) { if (el) el.textContent = '-'; return; }
    const converted = users.filter(u => u.teamCode || u.isAdmin).length;
    el.textContent = Math.round((converted / users.length) * 100) + '%';
  }

  function renderNewSignups() {
    const el = document.getElementById('stat-new-signups');
    if (!el) return;
    const now = Date.now();
    const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
    const weekStart = now - 7 * 86400000;
    const today = users.filter(u => u.createdAt && u.createdAt.toMillis() >= todayStart.getTime()).length;
    const week = users.filter(u => u.createdAt && u.createdAt.toMillis() >= weekStart).length;
    el.textContent = `${today}명 · ${week}명`;
  }

  function userRoleLabel(u) {
    if (u.isOperator) return '운영자';
    if (u.isAdmin) return '팀장';
    return '회원';
  }

  function renderUserTable() {
    const q = document.getElementById('user-search-input').value.trim().toLowerCase();
    const filtered = q ? users.filter(u => displayName(u).toLowerCase().includes(q)) : users;
    const body = document.getElementById('user-table-body');
    if (!filtered.length) {
      body.innerHTML = `<tr><td colspan="4"><div class="empty-state">검색 결과가 없어요</div></td></tr>`;
      return;
    }
    body.innerHTML = filtered.map(u => `
      <tr>
        <td>${escapeHtml(displayName(u))}</td>
        <td>${escapeHtml(u.teamCode || u.adminTeamCode || '-')}</td>
        <td>${userRoleLabel(u)}</td>
        <td>${formatDateShort(u.createdAt)}</td>
      </tr>
    `).join('');
  }

  // ══════════════ 팀 목록 ══════════════
  let teamsAll = [];
  let teamsUnsub = null;

  function startTeamsWatch() {
    if (teamsUnsub) return;
    teamsUnsub = colTeams.onSnapshot(snap => {
      teamsAll = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTeamsList();
    }, () => {});
  }

  const STALE_LEADER_DAYS = 14;

  // 팀장 마지막 접속일 — tools_presence 문서는 오프라인이어도 지워지지 않고 lastSeen이
  // 남아있으므로(실시간 접속중 판정용 90초 staleness 기준과 별개로), 여기선 그 값을
  // "마지막으로 확인된 접속 시각"으로 그대로 재사용한다(운영자 대시보드 전용 데이터라
  // 별도 수집 없이 기존 하트비트 문서만으로 계산 가능)
  function leaderLastSeenLabel(adminUid) {
    const p = presenceDocs.find(x => x.id === adminUid);
    if (!p || !p.lastSeen) return { label: '접속 기록 없음', stale: true };
    const ms = p.lastSeen.toMillis();
    const days = Math.floor((Date.now() - ms) / 86400000);
    const label = days <= 0 ? '오늘 접속' : `${days}일 전 접속`;
    return { label, stale: days >= STALE_LEADER_DAYS };
  }

  function renderTeamsList() {
    const listEl = document.getElementById('teams-list');
    const countEl = document.getElementById('teams-count');
    if (!listEl || !countEl) return;
    const rows = teamsAll.map(t => {
      const leader = users.find(u => u.id === t.adminUid);
      const memberCount = users.filter(u => u.teamCode === t.id).length;
      const lastSeen = leaderLastSeenLabel(t.adminUid);
      return { code: t.id, leaderName: leader ? displayName(leader) : '알 수 없음', memberCount, active: t.active !== false, lastSeen };
    }).sort((a, b) => b.memberCount - a.memberCount || a.code.localeCompare(b.code));

    countEl.textContent = rows.length.toLocaleString('ko-KR');
    listEl.innerHTML = rows.map(t => `
      <div class="approve-row">
        <span class="approve-name">${escapeHtml(t.code)} <span style="color:var(--text-dim); font-weight:400;">· ${escapeHtml(t.leaderName)}</span>${t.active ? '' : ' <span class="tool-badge">비활성</span>'}</span>
        <span style="font-size:12px; text-align:right;">
          <span style="color:var(--text-dim);">팀원 ${t.memberCount}명</span><br>
          <span style="${t.lastSeen.stale ? 'color:var(--loss); font-weight:700;' : 'color:var(--text-dim);'}">팀장 ${escapeHtml(t.lastSeen.label)}</span>
        </span>
      </div>`).join('') || '<div class="empty-state"><span class="empty-icon">👥</span>운영중인 팀이 없어요</div>';
  }

  // ══════════════ 실시간 접속자 ══════════════
  let presenceUnsub = null;
  let presenceTimer = null;
  let presenceDocs = [];

  function startPresenceWatch() {
    if (presenceUnsub) return;
    presenceUnsub = colPresence.onSnapshot(snap => {
      presenceDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPresence();
      renderTeamsList(); // 팀장 마지막 접속일이 presenceDocs를 참조하므로 같이 갱신
    }, () => {});
    if (!presenceTimer) presenceTimer = setInterval(renderPresence, 15000);
  }

  function refreshPresenceNow() {
    colPresence.get().then(snap => {
      presenceDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPresence();
      renderTeamsList();
    }).catch(() => {});
  }

  // 정상 하트비트 문서인지 검사 — 로그인 사용자는 문서 키가 본인 uid, 게스트는
  // guest_ 고정 키여야 함(index.html의 동일 로직과 동일한 이유로 유령 게스트 방어)
  function isValidPresenceDoc(p) {
    return p.uid ? p.id === p.uid : String(p.id).indexOf('guest_') === 0;
  }

  function presenceSinceLabel(p) {
    const t = p.since || p.lastSeen;
    if (!t) return '';
    return new Date(t.toMillis()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function renderPresence() {
    const countEl = document.getElementById('presence-count');
    const listEl = document.getElementById('presence-list');
    if (!countEl || !listEl) return;
    const cutoff = Date.now() - 90000;
    const online = presenceDocs.filter(p => isValidPresenceDoc(p) && p.lastSeen && p.lastSeen.toMillis() > cutoff);
    const rows = online.map(p => {
      const u = p.uid && users.find(x => x.id === p.uid);
      return { name: p.uid ? (u ? displayName(u) : '알 수 없음') : '게스트', since: presenceSinceLabel(p), isGuest: !p.uid };
    }).sort((a, b) => (a.isGuest - b.isGuest) || a.name.localeCompare(b.name, 'ko'));

    countEl.textContent = `${online.length}명 접속 중`;
    listEl.innerHTML = rows.map(r => `
      <div class="approve-row">
        <span class="approve-name"${r.isGuest ? ' style="color:var(--text-dim);"' : ''}>${escapeHtml(r.name)}</span>
        <span style="font-size:12px;color:var(--text-dim);">${escapeHtml(r.since)}부터</span>
      </div>`).join('') || '<div class="empty-state"><span class="empty-icon">👀</span>접속 중인 사람이 없어요</div>';
  }

  // ══════════════ 방문 통계 ══════════════
  function dateKeyDaysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function loadVisitStats() {
    const keys = Array.from({ length: 30 }, (_, i) => dateKeyDaysAgo(i));
    Promise.all(keys.map(k => colStats.doc('visits_' + k).get()))
      .then(docs => {
        const counts = keys.map((k, i) => ({ date: k, total: docs[i].exists ? (docs[i].data().total || 0) : 0 }));
        const today = counts[0].total;
        const sum7 = counts.slice(0, 7).reduce((a, c) => a + c.total, 0);
        const sum30 = counts.reduce((a, c) => a + c.total, 0);
        document.getElementById('stat-today').textContent = today.toLocaleString('ko-KR');
        document.getElementById('stat-avg7').textContent = Math.round(sum7 / 7).toLocaleString('ko-KR') + '명';
        document.getElementById('stat-sum30').textContent = sum30.toLocaleString('ko-KR');

        const listEl = document.getElementById('daily-visits-list');
        listEl.innerHTML = counts.slice(0, 14).map(c => `
          <div class="approve-row">
            <span style="font-size:13px; color:var(--text-dim);">${escapeHtml(c.date)}</span>
            <span style="font-size:14px; font-weight:700;">${c.total.toLocaleString('ko-KR')}명</span>
          </div>`).join('');
      })
      .catch(() => {});

    colStats.doc('dau_' + keys[0]).get()
      .then(doc => {
        const uids = doc.exists ? (doc.data().uids || []) : [];
        document.getElementById('stat-dau').textContent = uids.length.toLocaleString('ko-KR');
      })
      .catch(() => {});
  }

  // ══════════════ 문의함 ══════════════
  let inquiriesAll = [];
  let inquiriesUnsub = null;
  let inquiryFilter = 'all';
  const INQUIRY_TYPE_LABEL = { bug: '🐛 버그 신고', suggest: '💡 건의사항' };

  function startInquiriesWatch() {
    if (inquiriesUnsub) return;
    inquiriesUnsub = colInquiries.onSnapshot(snap => {
      inquiriesAll = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0));
      renderInquiryList();
      const openCount = inquiriesAll.filter(q => q.status === 'open').length;
      const badge = document.getElementById('inquiry-badge');
      if (openCount > 0) { badge.textContent = openCount; badge.style.display = ''; }
      else { badge.style.display = 'none'; }
    }, () => {});
  }

  function setInquiryFilter(f) {
    inquiryFilter = f;
    document.getElementById('inq-filter-all').classList.toggle('active', f === 'all');
    document.getElementById('inq-filter-open').classList.toggle('active', f === 'open');
    document.getElementById('inq-filter-closed').classList.toggle('active', f === 'closed');
    renderInquiryList();
  }

  function formatInquiryDate(ts) {
    if (!ts) return '';
    const d = ts.toDate();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return `${mm}/${dd} ${hh}:${mi}`;
  }

  function renderInquiryList() {
    const listEl = document.getElementById('dashboard-inquiry-list');
    const filtered = inquiryFilter === 'all' ? inquiriesAll : inquiriesAll.filter(q => q.status === inquiryFilter);
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-state"><span class="empty-icon">📮</span>문의가 없어요</div>';
      return;
    }
    listEl.innerHTML = filtered.map(q => `
      <div class="approve-row" style="align-items:flex-start; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
          <span class="tool-badge">${INQUIRY_TYPE_LABEL[q.type] || q.type}</span>
          <span style="font-size:11px; color:var(--text-dim);">${escapeHtml(q.authorName || '')} · ${formatInquiryDate(q.createdAt)}</span>
        </div>
        <div style="font-size:13px; line-height:1.5; white-space:pre-wrap;">${escapeHtml(q.content)}</div>
        <button class="btn small" onclick="toggleInquiryStatus('${q.id}', '${q.status}')">${q.status === 'open' ? '처리완료로 표시' : '다시 열기'}</button>
      </div>
    `).join('');
  }

  function toggleInquiryStatus(id, currentStatus) {
    colInquiries.doc(id).update({ status: currentStatus === 'open' ? 'closed' : 'open' })
      .then(() => showToast('상태를 변경했어요'))
      .catch(() => alert('변경 실패. 다시 시도해주세요.'));
  }

  // ══════════════ 로그인 게이트: 운영자만 통과 ══════════════
  let gateProfileUnsub = null;

  auth.onAuthStateChanged(user => {
    if (gateProfileUnsub) { gateProfileUnsub(); gateProfileUnsub = null; }

    if (!user) {
      document.getElementById('hamburger-btn').style.display = 'none';
      closeMenu();
      go('view-locked');
      return;
    }

    gateProfileUnsub = colToolsUsers.doc(user.uid).onSnapshot(doc => {
      if (!doc.exists || !doc.data().isOperator) {
        document.getElementById('hamburger-btn').style.display = 'none';
        closeMenu();
        go('view-forbidden');
        return;
      }
      document.getElementById('hamburger-btn').style.display = '';
      go('view-app');
      startUsersWatch();
      startTeamsWatch();
      startPresenceWatch();
      startInquiriesWatch();
      loadVisitStats();
    }, () => {
      document.getElementById('hamburger-btn').style.display = 'none';
      closeMenu();
      go('view-forbidden');
    });
  });
</script>
</body>
</html>
